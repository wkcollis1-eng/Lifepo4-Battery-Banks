name: CI - LiFePO4 Battery Bank (Windows-first)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  # Opt into Node.js 24 to suppress deprecation warnings
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: 3.12
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pandas numpy scipy

      - name: Lint with Ruff (ignore specific rules)
        run: ruff check . --ignore F401,F541,E741

      - name: Check formatting with Ruff (always succeed)
        run: ruff format --check || true

      - name: Type check with mypy
        run: |
          mypy parse_shelly_export.py
          mypy --ignore-missing-imports scripts/lifepo4_analysis.py scripts/update_voltage_chart.py || echo "Mypy warnings on analysis scripts (expected - no type hints yet)"

      - name: Smoke test ALL scripts
        run: python scripts/smoke_test.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Verify chart generated
        run: |
          if (Test-Path voltage_chart.html) {
            $size = (Get-Item voltage_chart.html).Length
            if ($size -eq 0) {
              Write-Error "voltage_chart.html is empty"
              exit 1
            }
          } else {
            Write-Error "voltage_chart.html not found"
            exit 1
          }
        shell: powershell

      - name: Upload voltage chart
        uses: actions/upload-artifact@v4
        with:
          name: voltage-chart-windows-${{ matrix.python-version }}
          path: voltage_chart.html
