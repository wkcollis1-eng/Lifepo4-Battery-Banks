name: CI - LiFePO4 Battery Bank (Windows-first)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  # Opt into Node.js 24 to suppress deprecation warnings
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pandas numpy scipy

      - name: Lint with Ruff
        run: ruff check . --ignore F401,F541,E741

      - name: Check formatting with Ruff
        run: ruff format --check .

      - name: Type check with mypy
        run: |
          mypy parse_shelly_export.py
          mypy --ignore-missing-imports scripts/lifepo4_analysis.py scripts/update_voltage_chart.py || echo "Mypy warnings on analysis scripts (expected - no type hints yet)"

      - name: Smoke test ALL scripts
        run: python scripts/smoke_test.py

      - name: Verify chart generated
        run: |
          if [ ! -s voltage_chart.html ]; then
            echo "Error: voltage_chart.html is missing or empty" >&2
            exit 1
          fi
        shell: bash

      - name: Upload voltage chart
        uses: actions/upload-artifact@v4
        with:
          name: voltage-chart-${{ matrix.os }}-${{ matrix.python-version }}
          path: voltage_chart.html
