#           operator reads SOC at the panel and manually opens the transfer switch /
#           breakers at ~20%. Previously SOC was visible only via WiFi->HA->phone; this
#           closes that gap with a local display that survives any network loss.
#           HARDWARE: Adafruit 938 (SSD1306, I2C 0x3C) on the EXISTING bus_a (GPIO6/7),
#             shared with the INA228 (0x40) — no new I2C bus, no pin cost. Connected via
#             STEMMA QT -> 4-pin Dupont (Adafruit 4209): Red=3V3, Black=GND, Blue=SDA
