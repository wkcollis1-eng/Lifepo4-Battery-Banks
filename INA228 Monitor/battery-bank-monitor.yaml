# ============================================================================
# Battery Bank Monitor V1.28 — PRODUCTION Configuration
#   CORE (backup readiness — must be correct): V/I/T acquisition, stale-bus FAULT
#     watchdog, 3-tier low-voltage alarms + overvoltage guard, bank_state machine,
#     runtime-remaining, and SOC (INA228 CHARGE register against a full-charge
#     anchor — V1.28). V1.28 moves the CHARGE read (hw_charge_ah), its INA228
#     reset check and the V1.26 bridge INTO CORE: they now source SOC.
#   OBSERVABILITY (free data, isolated — never feeds back into CORE): stasis
#     trend, lifetime + per-outage energy, self-discharge reconciliation logger,
#     opportunistic Ri. A bug in this layer can produce a wrong number but cannot
#     affect readiness detection.
#   Hardware target: Battery_Bank-Monitor-THT V2 (OSH Park); native INA228 8-pin
#     socket; external 375 µΩ DROK Kelvin shunt in negative cable (low-side).
#     INA228 onboard 15 mΩ shunt REMOVED; VBUS jumper LEFT OPEN (low-side default);
#     VBUS driven from positive busbar via inline-fused lead at breakout terminal block.
#   Source-level reviewed against ESPHome 2026.5.x; V1.28 validated against
#     ESPHome 2026.9.0 (config, codegen, host g++ of every lambda; the real
#     compile is Device Builder's). Flash-ready after credentials are set in
#     secrets.yaml. Apparent Ri (V1.8) remains PROVISIONAL.
# ============================================================================
# Purpose : Full instrumentation for 12V/500Ah LiFePO4 battery bank with
#           Giandel 1500W inverter and LiTime 80A charger. Reports V/I/P,
#           accumulated Ah/Wh, SOC estimate, temperature, charge/discharge
#           session metrics, and round-trip efficiency to Home Assistant via Wi-Fi.
#
# Hardware: XIAO ESP32-C3 + Adafruit INA228 breakout (5832 or 6349) + DS18B20
#           + Pololu D24V7F3 (3.3V buck)
#           on Battery_Bank-Monitor-THT V2 PCB (OSH Park).
#           Wiring per: battery-bank-monitor-wiring-summary-v1.8.md (low-side topology)
#
# INA228 hardware pre-build requirements (MANDATORY — V2 board, low-side topology):
#   1. Remove the onboard 15 mΩ shunt from the INA228 breakout PCB.
#   2. Leave the VBUS jumper OPEN (low-side default — jumper open means VBUS pin is
#      independent of VIN+). Wire the positive busbar to the VBUS terminal on the
#      breakout's own 3-position terminal block, through a 100–250 mA inline fuse
#      at the busbar end. This is the one wire at battery+ potential in this build.
#   3. No pin lifts, no R2 DNP, no Kelvin-lead fuses. All V1-carrier adaptations
#      are retired — the V2 board is native INA228. U2 pin 5 (VBUS) is a carrier
#      no-connect by design; ALERT routes natively to GPIO5 via U2 pin 8.
#   4. Verify Kelvin sense terminals on DROK 200A/75mV shunt (small screws, separate
#      from the heavy-current bolts). Sense leads sit near ground in low-side — no
#      inline fuses required on Kelvin leads.
#   5. Confirm TB1 polarity (pin 1 = GND, pin 2 = BATT_RAW) before energizing —
#      the V2 board has no reverse-polarity protection.
#
# Dashboard panels:
#   ① Real-time V / I / P (signed: positive = charging, negative = discharging)
#   ② SOC estimate — Coulomb-counted, anchored at each confirmed full charge
#   ③ Runtime remaining — hours and days at current net discharge rate
#   ④ Discharge phases — settling · plateau · knee · cliff state machine
#   ⑤ Ah/Wh counters — per-cycle (since last full charge) + lifetime totals
#   ⑥ Charge session tracking — CC/CV profile, peak current, CV/absorption time
#   ⑦ System health — temperatures, WiFi, INA228 and DS18B20 connectivity
#
# INA228 Configuration:
#   I2C address : 0x40 (A0, A1 jumpers OPEN — factory default on breakout)
#                 NOTE: UPS board has A0 bridged → 0x41. Different address.
#   Shunt       : 375 µΩ (DROK 200A/75mV manganin; onboard INA228 shunt REMOVED)
#   ADC range   : ±163.84 mV (adc_range 0 — mandatory for 75 mV at 200A shunt)
#   Max current : 400 A (V1.28, substitution ina_max_current_a; was 200 A)
#
# Sign convention — Option B wiring (low-side topology, V2 board):
#   Shunt installed in the negative cable between battery− and the negative busbar.
#   VIN+ at shunt battery-side Kelvin tap, VIN− at shunt load-side Kelvin tap.
#   VBUS wired from positive busbar to breakout VBUS terminal (jumper open).
#
#   POSITIVE current → CHARGING     (LiTime charger delivering current to bank)
#   NEGATIVE current → DISCHARGING  (net load exceeds charge rate)
#   Zero              → Standby     (load equals charge rate exactly)
#
#   Matches ups-monitor.yaml convention (positive = charging, negative = discharge).
#   The INA228 reports sign based on which input is at higher potential, NOT on
#   which side the chip sits — so Option B applies identically in high-side and
#   low-side topologies. Only the physical position of the shunt changes.
#   Confirm sign empirically at commissioning (§8.3 of wiring doc) and swap
#   VIN+/VIN− leads if inverted — no firmware change needed.
#
# Validated system parameters (LiFePO4_Report_2026-03-06.md):
#   Capacity: 397 Ah (Oct 2025 discharge test). Stasis OCV: 13.262–13.265 V.
#   Inverter RTE: 90.3% @ 440 W. LiTime: CC→80 A, CV→14.6 V, taper, stop.
#   Plateau/knee/cliff boundaries: TODO cross-check against report §Fig.1.
#
# Survival sleep: not implemented. V1.28: the monitor draws ~25 mA at 3.3 V
#   (the XIAO runs in modem sleep - diag2 TB-1 and Bill's B1 call, 2026-09-25;
#   Seeed's own XIAO test: 24 mA modem sleep, 74 mA no sleep), i.e. ~7-8 mA at
#   the bank. Was "~100 mA" (the no-sleep figure). Sleeping it would buy ~2 h,
#   not ~1 day. Protection: HA 3-tier automation + inverter LVC + BMS.
#
# vs ups-monitor.yaml: INA228 0x40 (not 0x41), external 375 µΩ shunt, 397 Ah,
#   float_voltage 13.26 V, no BP-65, no survival sleep.
#
# Changelog:
#   V1.28 — SOC from the INA228 CHARGE register; noise fixes from the diag2 run
#            (2026-09-25). Scope and evidence: docs/soc-noise-deep-dive.md §10.7,
#            docs/soc-v128-review.md B2/B3/O1/O2, docs/soc-accuracy-turnover.md §5.
#            NOISE (firmware only, diag2 [M]):
#            (a) wifi output_power 20 -> 11 dBm (TB-2: unlit sd 5.15 -> 1.84 mA,
#                ENERGY 0.449 -> 0.231 W; Q moved -2.2 mA with the noise).
#            (b) ADC 0xFFFC -> 0xFDC5: bus 2074 us, shunt 4120 us, temp 50 us,
#                AVG 256. Shunt time per reading x2 at the same 1.6 s cycle
#                (TB-5: sd ratio 0.735, CI 0.670-0.806, predicted 0.707).
#            SOC (CORE):
#            (c) SOC = 100 + net / C, net = CHARGE since the anchor, with CE applied
#                to charge in (O1: recon_coul_eff), the I_off term (soc_offset_ma)
#                and the SD model. No deadband. Ladder (review B3): confirmed
#                anchor > provisional anchor (seeded so SOC is continuous: from the
#                last CHARGE SOC, else the SW ledger) > SW-ledger movement from the
#                last CHARGE SOC while CHARGE is invalid. Never NAN. "SOC Source"
#                names the rung. The V1.27 ledger stays as "SOC (SW Ledger)".
#                Review 2026-09-25: the hours in the I_off term are carried across
#                a reboot (saved in 0.1 h steps, + uptime until HA time is valid).
#            (d) B2a: SHUNT_CAL, ADC_CONFIG and TEMP_LIMIT are checked on every
#                CHARGE poll against this boot's readback; a runtime INA228 reset
#                publishes nothing, says so, and reboots so the boot check bridges.
#                Review 2026-09-25: after 3 such reboots in a row the next waits
#                for 30 min of uptime (<= 2/h, not ~1/min), cleared after 1 h held.
#                B2b: the "first boot on sentinel firmware" branch is retired
#                (sentinel_established). B2c: CHARGE counts only if read within
#                180 s. A reset that cannot be bridged invalidates BOTH anchors.
#            (e) O2: the full-charge anchor needs the CV current to have tapered to
#                <= anchor_taper_max_a (10 A; LiTime stops at 6.48 A [M]).
#                Review 2026-09-25: a CV reading counts only once the next 5 s
#                reading is also CV, so the one averaged reading that straddles a
#                mid-CV charger stop cannot pass O2 (host test S4c).
#            (f) max_current 200 -> 400 A (one substitution drives the driver, the
#                CHARGE/ENERGY conversion and PWR_LIMIT, now 0x0960). The 350 A
#                plausibility guard can trip at last. LSB 0.763 mA, still finer than
#                the ADC's 0.833 mA step. The first V1.28 boot rescales the bridge
#                offsets by the register's count (hw_lsb_a), so HW Net Charge and
#                HW Energy continue without a step.
#            OBSERVABILITY:
#            (g) CHARGE bracket since the anchor, sign-split per poll: Ah in/out,
#                Wh in/out (dQ x V_bus - NOT the ENERGY register, which counts |P|
#                per conversion: +2.2 Wh/day of noise in the quiet state, +8.3 when
#                noisy [D]), hours, mean net current; per-session charge Ah/Wh; the
#                anchor closure at each full charge; RECON (Last Unseen Drain,
#                Recommended SD Rate, Suggested Offset Current) now from CHARGE
#                brackets between two clean anchors, sigma with the offset term.
#                The V1.27 ledger RECON is still logged, no longer published.
#            (h) Readbacks: INA228 SHUNT_CAL/ADC_CONFIG, Wi-Fi power-save mode and
#                TX power from the driver; an idle ENERGY-rate noise gauge + state.
#            (i) Comments: survival sleep ~100 mA -> ~25 mA; reset_on_boot is now
#                load-bearing; CURRENT_LSB literals replaced by the substitution.
#
#   V1.27 — Boot reset-check result PUBLISHED (2026-09-18). The V1.25/V1.26
#            on_boot INA228 check only LOGGED its outcome, ~0.2 s into boot
#            with serial off and Wi-Fi not yet up, so no one could read it:
#            after Bill's 16:11 Restart the API log stream's first line came
#            5.8 s after the reboot, and neither the check nor the boot
#            banner appeared [M]. The same message is now also published to
#            text_sensor "INA228 Reset Check" (diagnostic). HA receives an
#            entity's state when it connects, so the outcome survives the
#            gap and lands in history. No logic change: branches, thresholds
#            and counters are V1.26's.
#
#   V1.26 — HW counters survive a monitor power loss (Bill, 2026-09-18, after
#            rewiring twice dropped the INA228: CHARGE restarted from 0 at
#            2026-07-17 19:05Z and 2026-08-31 20:50Z [M]). OBSERVABILITY only.
#            (a) BRIDGE, don't just invalidate. HW Net Charge / HW Energy now
#                report register + a persisted offset and save their last value
#                in 10 mAh / 0.1 Wh steps (~21 + ~28 flash writes/day at idle
#                [D], host harness counted 21/28).
#                R13 2026-09-18: the 28 is wrong - ENERGY accumulates gross
#                |P|, measured +1.124 Wh/h at idle [M: 24.8 h, n=1489], so
#                ~270/day [D]. See the globals note. A
#                boot that CONFIRMS an INA228 reset (TEMP_LIMIT sentinel gone
#                AND CHARGE within 0.5 Ah of 0) sets the offset to the saved
#                value: the series continues and the HW anchor stays valid.
#                Sentinel gone but CHARGE still counting = first boot on
#                sentinel firmware, not a reset (V1.25 would have invalidated).
#                Unreadable chip or nothing saved: invalidate, as V1.25.
#                Lost either way: charge that moved while the monitor was off
#                (neither ledger can see it) and HW charge since the last save:
#                <= 10 mAh (save step) + ~2 min of flow (60 s read + 60 s flash
#                commit) = ~10.3 mAh at idle [D: 10 + 8.66 mA x 120 s / 3600],
#                1.0 Ah at a 30 A load [D: 30 x 120 / 3600].
#                CYCLE CONFIRM prints how many resets the cycle bridged.
#            (b) discharge_peak_a_raw persisted: a power loss between a
#                discharge and its recharge zeroed the cycle peak.
#            Verified on the host: boot check + HW lambdas extracted verbatim
#            and run against a simulated INA228 register file, both directions.
#
#   V1.25 — Pre-discharge-test review 2026-09-18, cross-checked against
#            ups-monitor V1.20. OBSERVABILITY ONLY: V/I acquisition, alarms,
#            bank_state, SOC and runtime are untouched. The Ri lambda of both
#            builds was compiled on the host and replayed on the only 3 heavy-
#            load events on record (2026-07-16) plus 9 synthetic faults [M]:
#            deployed V1.24 read 3.142 mOhm at 17:42 and LOST two synthetic
#            steps that should publish, with no log; V1.25 reads 3.041 mOhm at all
#            10 tick phases, captures both, and logs every non-capture.
#            (a) Ri WINDOWED GATE (ups-monitor V1.20 / Open Item 20 port). V1.21
#                tested the 45 s sample against the ARM sample — the first poll
#                past -25 A, normally a straddled 1.58 s window. At 17:42 the arm
#                read -70.83 A against -79.93 A at 45 s and passed by 1.45 A [M];
#                a 40 %-loaded first window, or a +12 % drift, lost the sample [M].
#                Now 5-20 s vs 30-45 s means gate it and Ri uses the 30-45 s
#                means — the UPS's windows, so the two series compare. 17:42
#                moves 3.142 -> 3.041 (-3.2 %): an earlier point on the
#                polarization curve (mean ~37.5 s, not 45 s), not an error.
#            (b) Ri = dV/dI. V1.8-V1.24 divided by -I_load: low by I_rest/I_load
#                whenever the rest point carried current (up to 5 A, e.g.
#                inverter idle). Linear cell, R0 2.200, rest -4 A: V1.24 2.090,
#                V1.25 2.2000 [M, harness]. It also makes a straddled rest sample
#                harmless — V and I dip by the same fraction (17:42: -0.40 A,
#                13.3107 V [M]). The UPS V1.18a rest-baseline guard is NOT ported:
#                it fixes V moving before I on separately throttled channels; here
#                both come from one driver read of one conversion window [M].
#            (c) Every Ri non-capture logs: reject, abort, and "not armed". A
#                STAGED load (14:22: rest -> -10.4 A for ~10 s -> -40 A) left the
#                rest reading 12 s old and was skipped in silence [M, replay].
#            (d) SW-HW DELTA computed at the HW register read (hw_charge_ah
#                on_value), not on its own 60 s poller: up to 1.33 Ah of timing
#                skew at 80 A [D: 80 A x 60 s / 3600].
#            (e) HW ANCHOR invalidated on INA228 power-on reset (TEMP_LIMIT
#                sentinel checked at boot). Not hypothetical: CHARGE restarted
#                from 0 at 2026-07-17 19:05Z and 2026-08-31 20:50Z, both reboots
#                on UNCHANGED firmware; the 09-07 OTA reboot kept it [M]. Had the
#                anchor been seeded, either would have left the delta and CYCLE
#                CONFIRM silently wrong.
#            (f) RECON: recon_min_ah_in 20 -> 1 Ah, and only brackets >=
#                recon_min_days (14 d) write the two entities. Since the 07-16
#                anchor the HW register has seen ~12.0 Ah leave the bank that
#                the SW ledger never booked [D: 0.04 + 8.15 + 3.72 Ah across the
#                two restarts, plus ~0.12 Ah before V1.23 at the same rate], so
#                the top-up that closes that 64-day bracket needs ~12 Ah plus the
#                internal term — likely under 20 Ah, and discarded. A 1-2 day
#                test bracket scaled x15-30 to %/month would have overwritten the
#                display [D].
#            (g) MANUAL ANCHOR breaks the recon bracket (last_anchor_epoch = 0):
#                it reset the counters U reads without moving the epoch.
#            (h) Version strings 1.19 -> 1.25. Header, project version and boot
#                log were never bumped past V1.19; V1.20-V1.24 are recorded
#                inline where they changed code.
#
#   V1.19 — CV/absorption-time telemetry + LED pattern swap + R4 value change:
#            • CV ABSORPTION TIME per charge session (charger-health trend
#              metric — absorption duration creeping upward across months is an
#              early indicator of capacity fade or a weak parallel string).
#              Accumulates while the absorption_phase sensor is pressed (handles
#              V-sag release/re-press within one session); finalized to
#              last_absorption_min at the full-charge anchor; discarded on
#              partial sessions. Two sensors: "CV Absorption Time" (last
#              completed session, persisted) and "CV Absorption Elapsed" (live,
#              current session). Sensor debounce (delayed_on 60s / delayed_off
#              30s) gives a constant ~-30s offset vs true CV time — irrelevant
#              for trending. In-progress timing is LOST on reboot (transient,
#              consistent with absorption_reached).
#            • LED pattern SWAPPED vs V1.18: SLOW flash (0.5 Hz) = idle/no
#              fault — continuous proof-of-life that the 250 ms loop runs (a
#              stuck-solid or stuck-dark LED is now unambiguously a fault);
#              SOLID = charging/discharging; FAST (2 Hz) = FAULT unchanged.
#            • R4 changed 220 Ω → 1 kΩ on PCB Rev 1.1 (~1.2 mA lit; ~0.6 mA
#              average at idle with 50% flash duty).
#
#   V1.18 — Production-review fixes + status LED (review vs ESPHome 2026.5.x
#            source and TI INA228 datasheet SLYS021):
#            • Fixed YAML parse error: Apparent-Ri interval block was indented
#              4 spaces (V1.17 as-shipped failed `esphome config`).
#            • Boot ALERT init rewritten: i2c::I2CBus has no write_register();
#              raw 3-byte writes {reg, MSB, LSB} used instead.
#            • DIAG_ALRT corrected to 0xA000 (ALATCH+SLOWALERT only). V1.16's
#              0xA0B8 wrote 1s into read-only/status flag positions — INA228
#              has no per-condition enable bits; limits arm via limit registers.
#            • DIAG_ALRT decode bit map corrected (each flag was one bit high):
#              MEMSTAT=0, CNVRF=1, POL=2, BUSUL=3, BUSOL=4, SHNTUL=5, SHNTOL=6,
#              TMPOL=7, MATHOF=9. MEMSTAT polarity fixed (1 = normal; V1.16
#              appended MEM-ERR on every alert).
#            • SUVL (0x0D) armed at −250A: in Option B low-side wiring discharge
#              current is negative shunt voltage, so SOVL alone only caught
#              charge-direction over-current. SHNTUL now decodes OVER-I(DIS),
#              SHNTOL OVER-I(CHG).
#            • Two `//` pseudo-comments on option lines (discharge_phase
#              update_interval, voltage_emergency delayed_on) → `#` (would have
#              failed time-period validation).
#            • Status LED on GPIO20 (D7) via R4, active-high: solid = idle/no
#              fault, 0.5 Hz flash = charging/discharging, 2 Hz flash = FAULT.
#              250 ms tick driver mirrors bank_state + charge/discharge flags.
#
#   V1.17 — Display redesign (simulator-verified). 4 fonts: font_soc(24),
#            font_runtime(28), font_body(12), font_hdr(10). All pages centred.
#            Page ①: SOC/V/I/W y=0/28/42/55. Page ②: RUNTIME @ LOAD header,
#            runtime font_runtime, slope+flag font_body. Page ③: 5 lines at
#            y=0/13/26/39/52 (13px even), STATUS+state combined, temp °F.
#            Page ④: combined charge header, 3 state lines font_hdr 13px gap.
#
#   V1.16 — INA228 ALERT pin armed on GPIO5 (D3). on_boot writes BUVL=12.20V,
#            BOVL=14.80V, SOVL=250A, POL=1500W; DIAG_ALRT=0xA0B8 (ALATCH,
#            SLOWALERT, active-low). GPIO5 binary_sensor decodes + publishes
#            alert_reason text sensor on interrupt.
#
#   V1.15 — V2 board: button GPIO21→GPIO4 (D2). GPIO20 clamp removed (true NC).
#
#   V1.14 — Local OLED (Adafruit 938, SSD1306 128×64, I2C 0x3D) on bus_a.
#            Wake button GPIO4. 4 pages button-cycled. Off by default; sleeps
#            after display_timeout (5min). turn_on/turn_off only (issue #1393).
#            reboot_timeout: 0s on api + wifi (continuous local readout).
#
#   V1.13 — Current plausibility guard (freeze SOC + FAULT at |I|>350A).
#            Voltage drop-filter (8–16V). Current Channel Fault sensor.
#            safe_mode configured. reboot_timeout: 0s.
#
#   V1.12 — update_interval 1s→2s (INA228 cycle ~1.58s). adc_time + adc_averaging
#            pinned explicitly. float_voltage corrected to 13.262V.
#
#   V1.11 — ESPHome 2026.4.3 review. Hardware locked (V1 carrier, high-side —
#            superseded V1.15 by V2/low-side). Restart button hardened (500ms
#            flush + safe_reboot).
#
#   V1.10 — Self-discharge reconciliation: U = recon_coul_eff×Ah_in − Ah_out
#            logged as recommended self_discharge_pct_per_month. HA time source
#            added. Writes nothing to SOC.
#
#   V1.9  — Self-discharge model hook (default 0.0 = inert). Per-outage Ah/Wh/
#            peak/avg/duration capture. CORE/OBSERVABILITY split documented.
#
#   V1.8  — Apparent Ri from rest→discharge steps (PROVISIONAL). Ri=ΔV/ΔI at
#            1s tick, sanity-banded, temperature-tagged.
#
#   V1.7  — Stale-bus integration trap fixed. absorption_reached stale-flag fixed.
#            Overvoltage alarm added. bank_state tiers corrected (EMERGENCY/
#            CRITICAL/WARNING). Coulombic efficiency relabeled.
#
#   V1.6  — NaN integration trap fixed (0.0f + integration_method:left).
#            SOC deadband premature clamp removed. Heavy-load absorption guard.
#            millis() watchdog type float→uint32_t.
#
#   V1.5  — Mean discharge voltage Wh/Ah (was Vh/Ah). NaN returns on integration
#            sources. Watchdog uses millis() not device_uptime.
#
#   V1.4  — bank_state 8-state machine. INA228 watchdog. Cycle health metrics.
#
#   V1.3  — Power register Wh integration. I2C 400kHz→100kHz.
#
#   V1.2  — SOC deadband 1A→50mA. Full-charge detection redesigned. DS18B20
#            filter_out -127.0. Runtime capped 720h.
#
#   V1.1  — Option B sign convention. Capacity 397Ah. float_voltage 13.26V.
#
#   V1.0  — Initial release.
# ============================================================================

substitutions:
  device_name: battery-bank-monitor
  friendly_name: "Battery Bank Monitor"
  device_description: "12V 500Ah LiFePO4 Bank — INA228 + DS18B20"

  # --- Battery & system parameters ------------------------------------------
  # Source: LiFePO4_Report_2026-03-06.md / discharge test Oct 2025
  validated_capacity_ah:    "397.0"  # Ah; measured Oct 2025 (decimal REQUIRED: lambdas append f suffix; 397f is ill-formed C++)
  validated_capacity_wh:    "5082"   # Wh; informational only (not referenced in any lambda)

  # --- Self-discharge model (default 0.0 = inert) ----------------------------
  # Models intrinsic cell self-discharge (bypasses shunt). At 0.0 integrates to
  # zero — SOC is pure measured Coulomb count. Set non-zero if aging makes it
  # measurable. Does NOT touch discharge_current or outage-energy path.
  self_discharge_pct_per_month: "0.0"   # %/month

  # --- Self-discharge reconciliation gate ------------------------------------
  # U = recon_coul_eff × Ah_in − Ah_out (unseen drain per clean full→full bracket).
  # Logged as recommended self_discharge_pct_per_month. Writes nothing to SOC.
  # Quality is duration-driven, not size-driven — trust long brackets.
  recon_coul_eff:           "0.99"   # coulombic efficiency (Ah_out/Ah_in)
                                     # V1.28 (O1): ALSO applied to SOC - each Ah of
                                     # charge in counts as recon_coul_eff Ah (the
                                     # conservative side; 1.0 turns it off).
  recon_min_ah_in:          "1.0"    # Ah; skip reconciliation below this charge size.
                                     # V1.25: was 20.0, which discarded the best bracket
                                     # there is — long idle, closed by a SMALL top-up
                                     # (see V1.25 (d)). 1 Ah only drops a charger start
                                     # on an already-full bank: at the >= 5.0 mA drain
                                     # the shunt books off-ledger [M, report 08-26], any
                                     # bracket over 8.3 d clears it [D: 1.0 Ah / 5.0 mA].
  recon_min_days:           "14.0"   # d; brackets shorter than this are LOGGED ONLY —
                                     # never written to the two recon entities (V1.25).
                                     # Same 14 d as the LOW-CONFIDENCE label (one constant).

  # --- V1.28: SOC from the INA228 CHARGE register ----------------------------
  ina_max_current_a:        "400.0"  # A; INA228 range. CURRENT_LSB = this / 2^19 [S: ESPHome
                                     # ina2xx_base.cpp: ldexp(max_current, -19)]. ONE source for
                                     # max_current, the CHARGE/ENERGY conversion and PWR_LIMIT.
                                     # Decimal REQUIRED (lambdas append f / divide as double).
  soc_offset_ma:            "0.0"    # mA; I_off - a constant drain the shunt does not see or
                                     # misreads. SOC subtracts I_off x hours since the anchor
                                     # (positive = SOC lower). Set it from "Suggested Offset
                                     # Current" after a clean full-to-full bracket.
  anchor_taper_max_a:       "10.0"   # A; O2 - a full-charge anchor needs the CV current to have
                                     # tapered to <= this before the charger stopped. LiTime
                                     # stops at 6.48 A (C/77) [M: commissioning report].
  ina_offset_max_ma:        "2.67"   # mA; INA228 offset limit 1 uV / 375 uOhm [S: TI SLYS021A
                                     # p1]. RECON sigma term (x hours of the bracket).

  # --- Voltage thresholds ----------------------------------------------------
  # absorption_voltage and float_voltage: reference only — not used in any lambda.
  absorption_voltage:       "14.60"  # V; reference: LiTime CV setpoint
  float_voltage:            "13.262" # V; reference: measured stasis OCV
  warning_voltage:          "12.40"  # V; notify — review load shedding
  critical_voltage:         "12.20"  # V; shed non-essential loads
  emergency_voltage:        "11.80"  # V; shut inverter NOW
  overvoltage_threshold:    "14.80"  # V; 0.20V above LiTime setpoint → charger fault

  # --- Discharge phase boundaries (LiFePO4 chemistry) -----------------------
  # TODO: cross-check against LiFePO4_Report_2026-03-06.md Fig.1 discharge curve.
  settling_min_v:           "13.00"  # V; above = OCV settling
  plateau_min_v:            "12.65"  # V; 12.65–13.00 = plateau
  knee_min_v:               "12.40"  # V; 12.40–12.65 = knee; below = cliff

  # --- Voltage slope thresholds (mV/min, EMA-smoothed) ----------------------
  knee_slope_threshold:     "-3.0"   # EMA < −3 mV/min → knee approaching
  cliff_slope_threshold:    "-10.0"  # EMA < −10 mV/min → cliff imminent

  # --- Plausibility bounds ---------------------------------------------------
  # V outside [8,16]: drop-filter → watchdog trips FAULT on sustained garbage.
  # |I| > 350A: non-physical (ADC saturated/Kelvin open) → freeze SOC + FAULT.
  v_min_plausible:          "8.0"    # V; below = non-physical → drop
  v_max_plausible:          "16.0"   # V; above = non-physical → drop
  i_max_plausible_a:        "350.0"  # A; above = saturated channel → freeze + FAULT

  # --- Display ---------------------------------------------------------------
  display_timeout:          "5min"   # auto-sleep from last button press

  # --- Current thresholds (Option B: positive = charging) -------------------
  # 50 mA ≈ 60× INA228 quantization step (312.5 nV ÷ 375 µΩ = 0.83 mA).
  # standby_threshold_a: reference only — not referenced in any lambda.
  discharge_threshold_a:    "-0.05"  # A; I < this → discharging
  charge_threshold_a:       "0.05"   # A; I > this → charging
  standby_threshold_a:      "0.05"   # A; reference only
  heavy_load_threshold_a:   "-50.0"  # A; I < this → HEAVY_LOAD (~640W at 12.8V)
  bulk_charge_threshold_a:  "5.0"    # A; I > this AND V < 14.2V → CHARGING_BULK

  # --- Full charge detection -------------------------------------------------
  full_charge_v_min:        "14.20"  # V; absorption floor (CV phase only sustains ≥14.2V)
  # Full-charge event fires on is_charging on_release after absorption_reached is set.

  # --- Apparent Ri (PROVISIONAL) ---------------------------------------------
  ri_min_step_a:            "25.0"   # A; min |ΔI| to qualify a rest→discharge step
  ri_quiescent_a:           "5.0"    # A; max |I_prev| to qualify as "from rest"
  ri_min_mohm:              "0.5"    # mΩ; sanity lower bound
  ri_max_mohm:              "50.0"   # mΩ; sanity upper bound

  # --- INA228 ALERT register values (written at boot) -----------------------
  # LSBs: BUVL/BOVL = 3.125 mV; SOVL = 5 µV; PWR_LIMIT = 0.3125 W


# ============================================================================
esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: ${device_description}
  includes:
    - "<esp_wifi.h>"   # V1.28: esp_wifi_get_ps / esp_wifi_get_max_tx_power readbacks
  project:
    name: "wkcollis1.battery-bank-monitor"
    version: "1.28"
  on_boot:
    - priority: -200
      then:
        - logger.log:
            level: INFO
            format: "Battery Bank Monitor V1.28 boot -- INA228 @ 0x40, DS18B20 on GPIO10"
        # Start panel dark — wakes on button press only. turn_off() not setup() (issue #1393).
        - lambda: 'id(panel).turn_off();'
        # alert_reason shows "none" from boot (V1.21) — not "unknown" until first alert
        - lambda: 'id(alert_reason).publish_state("none");'
        # INA228 ALERT register init — runs after component init (priority -200).
        # 200ms delay ensures INA228 is fully settled before arming; prevents a
        # brown-out reboot where the alert condition is already active from generating
        # a false "DIAG_ALRT read error" before the limit registers are written.
        # Limit registers first, then DIAG_ALRT to arm — all big-endian MSB first.
        # ALERT registers are NOT preserved across power cycles (unlike energy/charge
        # accumulators with reset_on_boot: false), so this runs on every boot.
        - delay: 200ms
        - lambda: |-
            // INA228 ALERT register initialization (V1.18 corrected).
            // i2c::I2CBus has NO write_register() — only write()/read()/write_readv()
            // (verified against esphome/components/i2c/i2c_bus.h). Register writes are
            // therefore raw 3-byte transactions: {register pointer, MSB, LSB}.
            // The driver never touches DIAG_ALRT in this config (it only reads it when
            // energy:/charge: sub-sensors are configured — ina2xx_base.cpp
            // read_diagnostics_and_act_), so the ALATCH latch is ours alone.
            // CAUTION: if energy:/charge: sub-sensors are ever added, the driver will
            // read DIAG_ALRT each cycle and clear the latch — revisit alert handling.

            auto wr16 = [](uint8_t reg, uint16_t val, const char *tag) {
              uint8_t buf[3] = { reg, (uint8_t)(val >> 8), (uint8_t)(val & 0xFF) };
              if (id(bus_a).write(0x40, buf, 3) != i2c::ERROR_OK)
                ESP_LOGW("alert_init", "%s write failed", tag);
            };

            // V1.25: INA228 power-on-reset detector for the HW charge anchor.
            // CHARGE (0x0A) survives an ESP-only reboot (3V3 stays up) but restarts
            // from 0 whenever the INA228 itself loses power; hw_charge_anchor_ah is
            // in ESP flash and did not know. TEMP_LIMIT (0x10) is written by NOTHING
            // but this lambda (ESPHome 2026.8.2 ina2xx_base.cpp: no write to 0x10 —
            // checked) and resets to 7FFFh [S: TI SLYS021A §7.6.1.17, p29; the p17
            // summary table says 0xFFFF — the sentinel differs from both]. We write
            // 0x7FFE (255.98 C, never-trip like the default) and read it back at the
            // next boot: anything else = the chip was reset since = anchor invalid.
            // A failed read is treated as a reset: an Unknown delta is honest, a
            // delta against a restarted register is not.
            // V1.26: a CONFIRMED reset is BRIDGED instead (Bill, 2026-09-18: keep
            // the HW data through a monitor power loss). hw_charge_ah/hw_energy_wh
            // report register + a persisted offset and persist their last value;
            // on a reset the offset becomes that saved value, so the counters carry
            // on from where they stopped and the anchor stays valid. Unreadable, or
            // nothing saved to bridge from: invalidate. Neither ledger sees charge
            // that moved while the monitor was off, or HW charge since the last
            // save: <= 10 mAh (save step) + ~2 min of flow (60 s read + 60 s flash
            // commit) — ~10.3 mAh at idle [D: 10 + 8.66 mA x 120 s / 3600], 1.0 Ah
            // at 30 A [D: 30 x 120 / 3600].
            // V1.28 (review B2b): the V1.26 "sentinel gone but CHARGE still counting
            // = first boot on sentinel firmware" branch is RETIRED. V1.25-V1.27
            // established the sentinel, so once sentinel_established is set a
            // missing sentinel always means a reset. The old 0.5 Ah test assumed the
            // check ran ~3 s after power-up; a reset caught by a poll during an 80 A
            // charge reaches 2.9 Ah [D: 80 x 2.18 x 60 / 3600] and was misread.
            // V1.28: CHARGE sources SOC (CORE). A reset that is not bridged
            // invalidates BOTH anchors; SOC then carries on from the last CHARGE
            // SOC through a provisional anchor (soc_estimate, review B3).
            {
              uint8_t reg = 0x10;
              uint8_t b[2] = {0, 0};
              bool ok = (id(bus_a).write(0x40, &reg, 1, false) == i2c::ERROR_OK) &&
                        (id(bus_a).read(0x40, b, 2) == i2c::ERROR_OK);
              uint16_t tl = ((uint16_t) b[0] << 8) | b[1];
              // Raw registers through the sensors' own reads (one copy of each
              // conversion). hw_anchor_checked is still false: reads, no publish.
              id(hw_charge_ah).update();
              id(hw_energy_wh).update();     // V1.28: raw ENERGY for the LSB migration
              float raw_ah = id(hw_charge_raw_ah);
              float raw_wh = id(hw_energy_raw_wh);
              bool anchored = !isnan(id(hw_charge_anchor_ah)) || !isnan(id(hw_prov_anchor_ah));
              // V1.27: the outcome is also PUBLISHED (ina228_reset_check). This runs
              // ~0.2 s into boot, before Wi-Fi is up and with serial off, so the log
              // line alone reaches no one. One message, two sinks.
              char rc[256];
              if (ok && tl == 0x7FFE) {
                snprintf(rc, sizeof(rc),
                  "INA228 kept power across this boot (TEMP_LIMIT sentinel intact) - SOC anchor %s",
                  anchored ? "still valid" : "not yet seeded");
                ESP_LOGI("bank.hwcheck", "%s", rc);
              } else if (!ok || isnan(raw_ah)) {
                snprintf(rc, sizeof(rc),
                  "INA228 reset check could not run (TEMP_LIMIT read %s, CHARGE read %s) - SOC anchor %s; SOC carries on from the last CHARGE SOC",
                  ok ? "ok" : "FAILED", isnan(raw_ah) ? "FAILED" : "ok",
                  anchored ? "INVALIDATED" : "was not seeded");
                ESP_LOGW("bank.hwcheck", "%s", rc);
                id(hw_charge_anchor_ah) = NAN;
                id(hw_prov_anchor_ah) = NAN;
              } else if (!id(sentinel_established)) {
                // Legacy only: a chip that never had the sentinel written.
                snprintf(rc, sizeof(rc),
                  "TEMP_LIMIT=0x%04X and the sentinel was never established: first boot writing it, no reset assumed - SOC anchor %s",
                  tl, anchored ? "still valid" : "not yet seeded");
                ESP_LOGI("bank.hwcheck", "%s", rc);
              } else if (!isnan(id(hw_charge_saved_ah))) {
                id(hw_charge_offset_ah) = id(hw_charge_saved_ah);
                if (!isnan(id(hw_energy_saved_wh)))
                  id(hw_energy_offset_wh) = id(hw_energy_saved_wh);
                id(hw_bridge_count) += 1;
                snprintf(rc, sizeof(rc),
                  "INA228 power-on reset (TEMP_LIMIT=0x%04X, CHARGE=%.4f Ah): counters BRIDGED from the last saved %.3f Ah / %.1f Wh - SOC anchor %s (bridge #%d this cycle)",
                  tl, raw_ah, id(hw_charge_saved_ah), id(hw_energy_saved_wh),
                  anchored ? "KEPT" : "not yet seeded", id(hw_bridge_count));
                ESP_LOGW("bank.hwcheck", "%s", rc);
              } else {
                snprintf(rc, sizeof(rc),
                  "INA228 power-on reset (TEMP_LIMIT=0x%04X, CHARGE=%.4f Ah) and no saved value to bridge from - SOC anchor %s; SOC carries on from the last CHARGE SOC",
                  tl, raw_ah, anchored ? "INVALIDATED" : "was not seeded");
                ESP_LOGW("bank.hwcheck", "%s", rc);
                id(hw_charge_anchor_ah) = NAN;
                id(hw_prov_anchor_ah) = NAN;
              }
              // V1.28: CURRENT_LSB migration. With reset_on_boot: false the CHARGE
              // and ENERGY registers keep their RAW COUNT when max_current changes,
              // but each count now means a different current [S: ESPHome
              // ina2xx_base.cpp: SHUNT_CAL is rewritten at setup, RSTACC is not set].
              // Re-read at the new LSB, the history would scale by new/old (x2 for
              // 200 -> 400 A: HW Net Charge would step by its whole accumulated
              // value). hw_lsb_a holds the LSB the offsets were built on; when it
              // differs, rescale the offsets by the register's own count:
              //   old value = R x LSB_old + off_old = R x LSB_new + off_new
              //   off_new   = off_old + raw_now x (LSB_old / LSB_new - 1)
              // raw_now is R x LSB_new (hw_charge_raw_ah). Counts taken between the
              // driver's SHUNT_CAL write and this read (~1-3 s) are mis-scaled by
              // the same factor: ~0.01 mAh at idle [D: 10 mA x 3 s].
              {
                const float lsb_now = ${ina_max_current_a}f / 524288.0f;
                const float lsb_old = id(hw_lsb_a);
                if (fabsf(lsb_old - lsb_now) > 1e-9f) {
                  if (!isnan(raw_ah) && !isnan(raw_wh)) {
                    const float k = lsb_old / lsb_now - 1.0f;
                    id(hw_charge_offset_ah) += raw_ah * k;
                    id(hw_energy_offset_wh) += raw_wh * k;
                    ESP_LOGW("bank.hwcheck",
                      "CURRENT_LSB %.6g -> %.6g A: bridge offsets rescaled by the registers' %.4f Ah / %.1f Wh so HW Net Charge / HW Energy continue",
                      lsb_old, lsb_now, raw_ah, raw_wh);
                  } else {
                    id(hw_charge_anchor_ah) = NAN;
                    id(hw_prov_anchor_ah) = NAN;
                    ESP_LOGW("bank.hwcheck",
                      "CURRENT_LSB %.6g -> %.6g A but the registers were unreadable: HW series may step once; SOC anchor invalidated, SOC carries on",
                      lsb_old, lsb_now);
                  }
                  id(hw_lsb_a) = lsb_now;
                }
              }
              id(hw_anchor_checked) = true;
              id(ina228_reset_check).publish_state(rc);   // V1.27
            }
            wr16(0x10, 0x7FFE, "TEMP_LIMIT");   // V1.25: POR sentinel (see above)
            id(sentinel_established) = true;    // V1.28 (B2b)

            // V1.28 (B2a): capture this boot's INA228 configuration as the reference
            // the CHARGE poll checks every 60 s. Read from the chip rather than
            // hard-coded: the driver TRUNCATES 13107.2e6 x LSB x R to an integer, so
            // it may be 3749 or 3750 [S: ina2xx_base.cpp configure_shunt_]. A POR
            // restores SHUNT_CAL 1000h and ADC_CONFIG FB68h [S: SLYS021A §7.6.1].
            {
              auto rd16 = [](uint8_t r, uint16_t &out) -> bool {
                uint8_t bb[2] = {0, 0};
                if (id(bus_a).write(0x40, &r, 1, false) != i2c::ERROR_OK) return false;
                if (id(bus_a).read(0x40, bb, 2) != i2c::ERROR_OK) return false;
                out = ((uint16_t) bb[0] << 8) | bb[1];
                return true;
              };
              uint16_t sc = 0, ac = 0;
              bool ok2 = rd16(0x02, sc) && rd16(0x01, ac);
              id(ina_expect_shunt_cal) = sc;
              id(ina_expect_adc_config) = ac;
              id(ina_expect_valid) = ok2;
              // Design values: 0xFDC5 = MODE F | VBUSCT 2074 us | VSHCT 4120 us |
              // VTCT 50 us | AVG 256 (the ina2xx block); SHUNT_CAL = 13107.2e6 x
              // (max_current / 2^19) x 375 uOhm = 3750 at 400 A.
              const uint16_t sc_design = (uint16_t) (13107.2e6f * (${ina_max_current_a}f / 524288.0f) * 0.000375f);
              bool as_designed = ok2 && ac == 0xFDC5 && sc + 2 >= sc_design && sc <= sc_design + 2;
              char cr[200];
              snprintf(cr, sizeof(cr),
                "SHUNT_CAL=%u (design %u) ADC_CONFIG=0x%04X (design 0xFDC5)%s",
                sc, sc_design, ac,
                !ok2 ? " - READ FAILED: runtime reset check off this boot" :
                (as_designed ? "" : " - NOT AS DESIGNED"));
              if (as_designed) ESP_LOGI("bank.hwcheck", "%s", cr);
              else             ESP_LOGW("bank.hwcheck", "%s", cr);
              id(ina228_config_readback).publish_state(cr);
            }
            // V1.28: publish the HW counters now that the offset is decided, so SOC
            // leaves its boot fallback at once instead of after the first 60 s poll.
            id(hw_charge_ah).update();
            id(hw_energy_wh).update();

            // Limit registers first, then DIAG_ALRT to arm — all big-endian MSB first.
            // BUVL (0x0F): bus under-voltage — 12.20 V / 3.125 mV = 3904 = 0x0F40
            wr16(0x0F, 0x0F40, "BUVL");
            // BOVL (0x0E): bus over-voltage — 14.80 V / 3.125 mV = 4736 = 0x1280
            wr16(0x0E, 0x1280, "BOVL");
            // SOVL (0x0C): shunt over-voltage = CHARGE-direction over-current.
            //   +250 A × 375 µΩ = +93.75 mV / 5 µV (ADCRANGE=0) = 18750 = 0x493E
            wr16(0x0C, 0x493E, "SOVL");
            // SUVL (0x0D): shunt under-voltage = DISCHARGE-direction over-current
            //   (Option B: discharge is negative shunt voltage; SOVL alone would only
            //   ever fire on an impossible +250 A charge — the 80 A LiTime can't reach it).
            //   −250 A → −93.75 mV / 5 µV = −18750 → two's complement 0xB6C2
            wr16(0x0D, 0xB6C2, "SUVL");
            // PWR_LIMIT (0x11): power over-limit, 1500 W. PWR_LIMIT LSB = 256 × POWER
            //   LSB = 256 × 3.2 × CURRENT_LSB. V1.28: 400 A / 2^19 -> 0.625 W -> 2400 =
            //   0x0960 (V1.27 at 200 A: 0.3125 W -> 0x12C0). Computed from the one
            //   substitution so it cannot drift from max_current again.
            //   POWER register is magnitude — POL covers both directions.
            {
              const float pwr_lsb = 256.0f * 3.2f * (${ina_max_current_a}f / 524288.0f);
              wr16(0x11, (uint16_t) lroundf(1500.0f / pwr_lsb), "PWR_LIMIT");
            }

            // DIAG_ALRT (0x0B): 0xA000 = ALATCH(bit15) + SLOWALERT(bit13) ONLY.
            // The limit-violation bits (POL=2, BUSUL=3, BUSOL=4, SHNTUL=5, SHNTOL=6,
            // TMPOL=7 — INA228 datasheet SLYS021 register map) are hardware STATUS FLAGS, not enables;
            // the INA228 has no per-condition enable bits. Alerts are "disabled" by
            // leaving their limit registers at the never-trip defaults (SUVL/TEMP_LIMIT
            // defaults are never-trip; we now set SUVL deliberately above).
            // The previous 0xA0B8 wrote 1s into status-flag bits — removed.
            // ALATCH=1: pin stays asserted until DIAG_ALRT is read.
            // SLOWALERT=1: alert evaluated on averaged conversions (matches AVG=128).
            // APOL=0: active-low (matches open-drain ALERT with R2 pull-up to 3V3).
            wr16(0x0B, 0xA000, "DIAG_ALRT");
            ESP_LOGI("alert_init",
              "INA228 ALERT armed: BUVL=12.20V BOVL=14.80V SOVL=+250A SUVL=-250A POL=1500W");

esp32:
  board: seeed_xiao_esp32c3
  framework:
    type: esp-idf

logger:
  level: INFO
  baud_rate: 0              # Disable serial — USB must NOT be connected in production

api:
  encryption:
    key: !secret api_key_battery_bank_monitor
  # reboot_timeout: 0s — continuous local readout takes priority over network recovery.
  # Crash-loop recovery via safe_mode. Set e.g. 4h instead of 0s if wedge-recovery preferred.
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  # Tell the TOOLING where to find this device. Default is
  # <name>.local, which the ESPHome add-on cannot resolve: it runs in a
  # container, and containers generally have no mDNS resolver. That is why
  # the dashboard showed this device offline while HA was talking to it
  # normally on the very same network.
  # Read from this YAML by the dashboard - no reflash needed to take effect.
  # Pair with a DHCP reservation, or this goes stale when the lease moves.
  use_address: 10.0.0.247
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  # V1.28: the driver's actual mode is published as "WiFi Power Save (Driver)".
  # B1 (Bill, 2026-09-25): the XIAO runs in modem sleep despite this setting —
  # radio off moved the shunt only +2.3 mA against >= 11.4 mA for a receiver
  # that stays on (diag2 TB-1). Left unchanged so the readback tests that.
  # Forcing true no-sleep would add ~12-16 mA of real drain for no noise gain.
  power_save_mode: none
  # V1.28: 11 dBm (was the 20 dBm default). diag2 TB-2 [M]: unlit noise fell
  # from sd 5.15 mA / ENERGY 0.449 W at 20 dBm to 1.84 mA / 0.231 W at 11 dBm,
  # the lit-OLED floor, and Q moved -2.2 mA with it. The knee is between 17
  # and 14 dBm; no disconnect in 48 min at <= 14 dBm. ESPHome also caps the
  # PHY calibration power at ceil(11) = 11 dBm [S: wifi/__init__.py].
  output_power: 11dB
  reboot_timeout: 0s  # same rationale as api reboot_timeout above
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret ap_password

captive_portal:

# Safe mode — crash-loop OTA recovery. Independent of reboot_timeout (triggers on
# boot-loops, not network loss). Bad configs can be re-flashed over WiFi.
safe_mode:
  num_attempts: 10      # default; enter safe mode after 10 failed-boot attempts
  reboot_timeout: 5min  # default; time held in safe mode before retrying a normal boot

mdns:
  disabled: false

# HA time — used by self-discharge reconciliation only (millis() can't span months).
# Skips reconciliation if unsynced; never emits a garbage interval.
time:
  - platform: homeassistant
    id: ha_time

# I2C: SDA=GPIO6 (D4), SCL=GPIO7 (D5). INA228 onboard pull-ups. Address 0x40
# (A0/A1 OPEN — do NOT bridge A0 as on UPS board which uses 0x41).
i2c:
  sda: GPIO6
  scl: GPIO7
  scan: false
  id: bus_a
  frequency: 100kHz  # 400kHz unnecessary at 1s telemetry — bus utilisation <0.3%
                      # at 100kHz. Lower clock rate reduces EMI on SDA/SCL, which
                      # run adjacent to 2/0 AWG cables carrying 200A transients.
                      # INA228 has no minimum I2C speed constraint (datasheet SLYS021 §7.5.3).

# 1-Wire: DS18B20 on GPIO10 (D10). Module has built-in 4.7 kΩ pull-up.
one_wire:
  - platform: gpio
    pin: GPIO10

# ============================================================================
# FONTS (V1.16) — four sizes for the local panel display.
# font_soc(24)     Page ① SOC line
# font_runtime(28) Page ② big runtime value
# font_body(12)    Body text across all pages (voltage, current, watts, state)
# font_hdr(10)     Small headers and sub-body lines (Pages ② ④)
# Roboto (Google Fonts) is fetched by ESPHome at compile time and baked into
# the binary; keep the font tables small.
# ============================================================================
font:
  - file: "gfonts://Roboto"
    id: font_soc          # Page ①  SOC line
    size: 24
  - file: "gfonts://Roboto"
    id: font_runtime      # Page ②  big runtime value
    size: 28
  - file: "gfonts://Roboto"
    id: font_body         # Pages ①②③④  body lines (voltage, current, watts, slope, state, charge)
    size: 12
  - file: "gfonts://Roboto"
    id: font_hdr          # Pages ②④  small header / sub-body lines
    size: 10

# ============================================================================
# DISPLAY (V1.17) — Adafruit 938 SSD1306 128x64, I2C 0x3D, on bus_a (shared w/ INA228).
# OFF by default (on_boot turns it off); woken by the GPIO4 button (see binary_sensor).
# Sleep/wake via turn_on()/turn_off() ONLY — never setup() (ESPHome issue #1393).
# Four pages, button-cycled (display.page.show_next). update_interval 1s is cheap:
# the panel is dark almost always, and a lit page refreshes its values each second.
# ============================================================================
display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    id: panel
    i2c_id: bus_a
    address: 0x3D  # STEMMA QT 938 ships ADDR jumper OPEN = 0x3D (bridge jumper for 0x3C)
    update_interval: 1s
    pages:
      # Layout v9 - for xxx.xA + xxxx.xW max
      # y=0  (24px)  0-24   SOC
      # y=26 (24px)  26-50  Voltage  2px gaps
      # y=52 (12px)  52-64  Split column A / W - bottom flush, no clip
      # x=6 left margin on all
      - id: page_main
        lambda: |-
          float soc = id(soc_estimate).state;
          if (isnan(soc)) it.print(6, 0, id(font_soc), "SOC: --");
          else            it.printf(6, 0, id(font_soc), "SOC: %.0f%%", soc);

          float v = id(ina228_voltage).state;
          if (isnan(v)) it.print(6, 26, id(font_soc), "V: --");
          else          it.printf(6, 26, id(font_soc), "%.2f V", v);

          float i = id(ina228_current).state;
          float p = id(signed_power).state;
          // Bottom line - split columns to fit 128px with max values
          if (isnan(i) || isnan(p)) {
            it.printf(6, 52, id(font_body), "%.1fA", 0.0);
            it.printf(68, 52, id(font_body), "%.1fW", 0.0);
            it.print(6, 52, id(font_body), "--A");
            it.print(68, 52, id(font_body), "--W");
          } else if ((i <= ${charge_threshold_a}f) && (i >= ${discharge_threshold_a}f)) {
            it.print(6, 52, id(font_body), "~0A");
            it.printf(68, 52, id(font_body), "%.1fW", fabsf(p));
          } else {
            it.printf(6, 52, id(font_body), "%.1fA", fabsf(i));
            it.printf(68, 52, id(font_body), "%.1fW", fabsf(p));
          }

      # ── Page ②: Runtime — remaining + slope + curve + SOC cue ──────────────
      - id: page_runtime
        lambda: |-
          it.print(6, 0, id(font_body), "RUNTIME @ LOAD");

          float h = id(runtime_hours).state;
          if (isnan(h))         it.print(6, 13, id(font_body), "not discharging");
          else if (h >= 720.0f) it.print(6, 13, id(font_body), ">30 days");
          else if (h >= 48.0f)  it.printf(6, 13, id(font_body), "%.0f h (%.1f d)", h, h / 24.0f);
          else                  it.printf(6, 13, id(font_body), "%.1f h", h);

          float s = id(voltage_slope).state;
          if (isnan(s)) it.print(6, 26, id(font_body), "slope: --");
          else          it.printf(6, 26, id(font_body), "slope: %.1f mV/min", s);

          if (id(cliff_imminent).state)        it.print(6, 39, id(font_body), "**CLIFF IMMINENT**");
          else if (id(knee_approaching).state) it.print(6, 39, id(font_body), "*knee approaching*");
          else                                 it.print(6, 39, id(font_body), "curve: stable");

          float soc = id(soc_estimate).state;
          if (!isnan(soc)) it.printf(6, 52, id(font_body), "SOC %.0f%% stop@20%%", soc);

      # ── Page ③: Health — state + fault status + temperature ────────────────
      - id: page_health
        lambda: |-
          if (id(bank_state).has_state())
            it.printf(6, 0, id(font_body), "STATUS: %s", id(bank_state).state.c_str());
          else
            it.print(6, 0, id(font_body), "STATUS: --");

          it.printf(6, 13, id(font_body), "INA228 wd: %s",
                    id(ina228_watchdog).state ? "FAULT" : "ok");

          it.printf(6, 26, id(font_body), "I-chan: %s",
                    id(current_channel_fault).state ? "FAULT" : "ok");

          it.printf(6, 39, id(font_body), "Temp sensor: %s",
                    isnan(id(battery_temp).state) ? "FAULT" : "ok");

          // battery_temp already publishes deg F (sensor filter converts) —
          // v6 bug: reapplied C->F here and showed 155.4F for a 68.5F reading.
          float t = id(battery_temp).state;
          if (isnan(t)) it.print(6, 52, id(font_body), "T: -- F");
          else          it.printf(6, 52, id(font_body), "T: %.1f F", t);

      # ── Page ④: Charge — absorption cue ────────────────────────────────────
      - id: page_charge
        lambda: |-
          float i = id(ina228_current).state;
          bool charging = (!isnan(i) && i > ${charge_threshold_a}f);
          if (charging) it.printf(6, 0, id(font_body), "CHARGE: +%.1f A", i);
          else          it.print(6, 0, id(font_body), "CHARGE: --");

          bool absorbed = id(absorption_reached);
          if (absorbed) {
            it.print(6, 13, id(font_body), "absorb CONFIRMED");
            it.print(6, 26, id(font_body), "OK to stop charger");
            it.print(6, 39, id(font_body), "SOC anchors 100%");
          } else if (charging) {
            it.print(6, 13, id(font_body), "absorb: not yet");
            it.print(6, 26, id(font_body), "hold >=14.2V 60s");
            it.print(6, 39, id(font_body), "then stop charger");
          } else {
            it.print(6, 13, id(font_body), "idle / discharging");
            it.print(6, 26, id(font_body), "Mark Full button");
            it.print(6, 39, id(font_body), "if anchor missed");
          }
  # on_boot: start dark (the panel only lights on a button press)
  # (handled in esphome: on_boot below)

# ============================================================================
# STATUS LED (V1.18, semantics revised V1.19) — 3 mm green LED on GPIO20 via
# R4 (1 kΩ, PCB Rev 1.1), active-high.
# Requires the Rev 1.1 PCB LED fix: GPIO20 → R4 → LED anode, LED cathode → GND.
# (As drawn in Rev 1, R4 ran from +3V3 and the LED cathode faced the GPIO node —
#  see review notes. If flashing a board built WITHOUT the fix and with the LED
#  physically reversed, change this output to open-drain:
#  pin: { number: GPIO20, mode: { output: true, open_drain: true } } — never
#  push-pull, or the pin sources unlimited current into the un-resistored LED.)
# Semantics (V1.19 — OBSERVABILITY: reads published states, cannot affect CORE):
#   SLOW flash = bank idle, no faults (1 s on / 1 s off). Idle-flash is the
#                proof-of-life signal: it is continuous evidence the 250 ms
#                loop is running. A stuck-SOLID or stuck-DARK LED is therefore
#                unambiguously a fault tell (frozen MCU / dead board) — this
#                closes the residual weakness of solid-at-idle, which could not
#                distinguish "alive and idle" from "frozen with pin latched".
#   SOLID      = charging or discharging (tracks the 30 s debounced
#                is_charging / is_discharging sensors)
#   FAST flash = FAULT (2 Hz; mirrors bank_state: stale bus, NaN, |I| > 350 A)
#   Boot:        pin defaults LOW → LED dark until the first 250 ms tick, then
#                idle-flash. Dark beyond ~10 s after power-up = commissioning
#                fault tell (§4.4 of wiring doc — XIAO C3 has no power LED).
# GPIO20 = XIAO D7 / U0RXD — free because logger baud_rate: 0 disables UART.
# Draw: ~1.2 mA while lit ((3.3 V − ~2.1 V Vf) / 1 kΩ); ~0.6 mA average at idle
# (50% duty). Flows through the shunt — the Coulomb counter sees it like the
# rest of the board's self-draw.
# ============================================================================
output:
  - platform: gpio
    id: led_out
    pin: GPIO20

# Display auto-sleep. mode: restart resets the timer on each button press.
script:
  - id: display_sleep_timer
    mode: restart
    then:
      - delay: ${display_timeout}
      - lambda: 'id(panel).turn_off();'

  # V1.28: the ONE place a SOC anchor is set - full charge (src 1, clean), the
  # manual button (2) and a provisional seed (3 ledger, 4 carried, 5 assumed).
  # Starts a new CHARGE bracket: the Ah/Wh in/out accumulators, the hours and
  # the I_off / CE terms all count from here. No delay: runs to completion
  # inside the caller's execute().
  - id: soc_anchor_set
    mode: queued
    parameters:
      anchor_ah: float
      src: int
      clean: bool
    then:
      - lambda: |-
          if (src >= 3) {
            id(hw_prov_anchor_ah) = anchor_ah;
          } else {
            id(hw_charge_anchor_ah) = anchor_ah;
            id(hw_prov_anchor_ah) = NAN;
          }
          id(soc_anchor_src) = src;
          id(brk_clean) = clean;
          id(brk_in_ah) = 0.0f;  id(brk_out_ah) = 0.0f;
          id(brk_whin) = 0.0f;   id(brk_whout) = 0.0f;
          id(brk_in_saved) = 0.0f;  id(brk_out_saved) = 0.0f;
          id(brk_whin_saved) = 0.0f; id(brk_whout_saved) = 0.0f;
          id(hours_since_anchor) = 0.0f;
          id(hours_since_anchor_saved) = 0.0f;
          id(hours_boot_base) = -(float) millis() / 3600000.0f;   // hours run on from 0 without HA time
          auto t = id(ha_time).now();
          id(anchor_epoch) = t.is_valid() ? (uint32_t) t.timestamp : 0u;   // 0 = set at first valid time
          id(soc_unclamped) = NAN;

  # V1.28 (B2a): a runtime INA228 reset was detected on a CHARGE poll. Reboot so
  # the boot check bridges it (2 s lets the log line and the text sensor leave).
  - id: ina_reset_reboot
    mode: single
    then:
      - delay: 2s
      - lambda: 'App.safe_reboot();'

globals:

  # Voltage slope (transient)
  - id: voltage_1min_ago
    type: float
    initial_value: 'NAN'
    restore_value: no

  - id: slope_ema
    type: float
    initial_value: 'NAN'
    restore_value: no

  # Charge session tracking (transient)
  - id: charge_session_start_v
    type: float
    initial_value: '0.0'
    restore_value: no

  - id: charge_peak_a_raw
    type: float
    initial_value: '0.0'
    restore_value: no

  # CV/absorption-time tracking (V1.19, transient). millis()-based; uint32_t
  # subtraction is wrap-safe. start_ms != 0 marks an open CV segment;
  # ms_accum sums all CV segments within one charge session (V-sag re-entry).
  - id: absorption_start_ms
    type: uint32_t
    initial_value: '0'
    restore_value: no

  - id: absorption_ms_accum
    type: uint32_t
    initial_value: '0'
    restore_value: no

  # Full-charge cycle summary (persisted)
  - id: last_cycle_ah_in
    type: float
    initial_value: '0.0'
    restore_value: yes      # Ah charged into bank during last completed cycle

  - id: last_cycle_ah_out
    type: float
    initial_value: '0.0'
    restore_value: yes      # Ah discharged from bank during last completed cycle

  - id: last_coulombic_eff
    type: float
    initial_value: '0.0'
    restore_value: yes      # Coulombic efficiency Ah_out/Ah_in × 100% (≠ energy RTE)

  - id: last_absorption_min
    type: float
    initial_value: '0.0'
    restore_value: yes      # CV/absorption minutes, last completed full-charge session
                            # (V1.19). Upward trend across months = charger-health /
                            # capacity-fade early indicator.

  # Self-discharge reconciliation (persisted). Two clean anchors needed to measure U.
  - id: last_anchor_epoch
    type: uint32_t
    initial_value: '0'
    restore_value: yes
  - id: last_unseen_drain_ah
    type: float
    initial_value: '0.0'
    restore_value: yes
  - id: last_recommended_sd_rate
    type: float
    initial_value: '0.0'
    restore_value: yes

  - id: total_full_charge_count
    type: int
    initial_value: '0'
    restore_value: yes      # Persistent cycle count — lifetime health indicator

  # Outage tracking (persisted). Isolated from CORE — bugs here cannot affect readiness.
  - id: outage_elapsed_s
    type: uint32_t
    initial_value: '0'
    restore_value: yes      # V1.20 fix: duration now shares the persistence class of
                            # Ah/Wh/peak — a mid-outage reboot no longer corrupts avg.
                            # (Outage #2 defect: OTA mid-event zeroed the millis anchor,
                            # no on_press re-fired, avg = full-event Wh / post-reboot h.)
  - id: outage_peak_w
    type: float
    initial_value: '0.0'
    restore_value: yes      # Persisted: survives brownout-reboot mid-outage
  - id: last_outage_ah
    type: float
    initial_value: '0.0'
    restore_value: yes
  - id: last_outage_wh
    type: float
    initial_value: '0.0'
    restore_value: yes
  - id: last_outage_peak_w
    type: float
    initial_value: '0.0'
    restore_value: yes
  - id: last_outage_avg_w
    type: float
    initial_value: '0.0'
    restore_value: yes
  - id: last_outage_hours
    type: float
    initial_value: '0.0'
    restore_value: yes
  - id: total_outage_count
    type: int
    initial_value: '0'
    restore_value: yes

  - id: last_charge_peak_a
    type: float
    initial_value: '0.0'
    restore_value: yes      # Peak LiTime CC current; declining trend = charger aging

  # Set by absorption_phase sensor; cleared in is_charging on_release. Transient.
  - id: absorption_reached
    type: bool
    initial_value: 'false'
    restore_value: no

  # Discharge cycle peak (transient, most-negative I since last full charge)
  - id: discharge_peak_a_raw
    type: float
    initial_value: '0.0'
    restore_value: yes      # V1.26: was no — a power loss between a discharge and
                            # its recharge (e.g. rewiring) zeroed the cycle peak, and
                            # the anchor then published no Last Discharge Peak. Only
                            # written when a new peak is found, so flash-cheap.

  # Discharge cycle summary (persisted)
  - id: last_discharge_peak_a
    type: float
    initial_value: '0.0'
    restore_value: yes    # Peak discharge current magnitude last completed cycle

  - id: last_discharge_mean_v
    type: float
    initial_value: '0.0'
    restore_value: yes    # Wh/Ah = current-weighted mean V; declining = rising Ri

  # INA228 watchdog timestamp. uint32_t for wrap-safe millis() subtraction.
  - id: last_ina228_update
    type: uint32_t
    initial_value: '0'
    restore_value: no

  # Apparent Ri prev-sample holders (PROVISIONAL, transient, NaN-seeded)
  - id: ri_rest_v
    type: float
    initial_value: 'NAN'
    restore_value: no       # rolling rest-voltage baseline (|I| <= quiescent)
  - id: ri_rest_ms
    type: uint32_t
    initial_value: '0'
    restore_value: no       # when the rest baseline was last refreshed
  - id: ri_trig_ms
    type: uint32_t
    initial_value: '0'      # step trigger time; 0 = no measurement pending
    restore_value: no
  - id: ri_trig_i
    type: float
    initial_value: 'NAN'    # current at trigger — stability gate at maturity (V1.21)
    restore_value: no       # V1.25: log-only (the gate now uses ri_trig_isum/n)
  - id: ri_rest_i
    type: float
    initial_value: 'NAN'    # V1.25: current of the rest point — Ri = dV/dI, and the
    restore_value: no       # rest point may carry up to ri_quiescent_a (5 A)
  # V1.25 windowed gate (ported from ups-monitor V1.20): sums over 5-20 s (gate
  # reference) and 30-45 s (gate test + Ri evaluation) after arming. Transient.
  - id: ri_trig_isum
    type: float
    initial_value: '0.0'
    restore_value: no
  - id: ri_trig_n
    type: int
    initial_value: '0'
    restore_value: no
  - id: ri_eval_vsum
    type: float
    initial_value: '0.0'
    restore_value: no
  - id: ri_eval_isum
    type: float
    initial_value: '0.0'
    restore_value: no
  - id: ri_eval_n
    type: int
    initial_value: '0'
    restore_value: no
  - id: ri_sample_count
    type: int
    initial_value: '0'
    restore_value: yes
  - id: last_ri_mohm
    type: float
    initial_value: 'NAN'
    restore_value: yes      # V1.22: last valid Ri survives reboot/OTA (HA request)
  - id: last_ri_temp_f
    type: float
    initial_value: 'NAN'
    restore_value: yes      # temp tag of that sample, persisted with it
  - id: hw_charge_anchor_ah
    type: float
    initial_value: 'NAN'
    restore_value: yes      # V1.23: INA228 hardware CHARGE register value at the
                            # last full-charge anchor. Register survives ESP
                            # reboots (3V3 rail stays up) but zeroes on INA228
                            # power removal — after a power loss the cycle delta
                            # is invalid until the next anchor re-seeds it.
                            # V1.25: on_boot now DETECTS that power loss (TEMP_LIMIT
                            # sentinel) and sets this back to NAN.
                            # V1.26: ...only when it cannot BRIDGE the reset (no
                            # saved value, or the check could not read the chip).
  - id: hw_anchor_checked
    type: bool
    initial_value: 'false'  # V1.25: true once this boot's INA228 power-on-reset
    restore_value: no       # check has run; the SW-HW delta reads Unknown before it
                            # V1.26: the HW sensors also publish nothing before it
  # V1.26: bridging the HW counters across an INA228 power-on reset (on_boot).
  # Reported value = register + offset; the offset moves only when a reset is
  # bridged. *_saved = last reported value, persisted in steps (not every read)
  # so flash writes stay ~21 + ~28/day at idle (charge, energy) [D: 8.66 mA ->
  # 10 mAh per 69 min; 0.114 W -> 0.1 Wh per 53 min; host harness counted 21/28].
  # R13 2026-09-18: the energy figure is wrong. ENERGY accumulates gross |P|, not
  # the net 0.114 W the harness modelled; it rose 1.124 Wh/h at idle [M: HA
  # history, 24.8 h to 09-18 19:48Z, n=1489] -> ~270 saves/day [D: 1.124 x 24
  # / 0.1]. Each is capped at one save per 60 s read. NVS is 0x70000 = 112 pages
  # [S: generated partitions.csv], so neither rate is a wear concern.
  - id: hw_charge_offset_ah
    type: float
    initial_value: '0.0'
    restore_value: yes
  - id: hw_charge_saved_ah
    type: float
    initial_value: 'NAN'    # NAN = nothing to bridge from (first boot on V1.26)
    restore_value: yes
  - id: hw_energy_offset_wh
    type: float
    initial_value: '0.0'
    restore_value: yes
  - id: hw_energy_saved_wh
    type: float
    initial_value: 'NAN'
    restore_value: yes
  - id: hw_charge_raw_ah
    type: float
    initial_value: 'NAN'    # raw CHARGE register Ah as last read (the boot check's
    restore_value: no       # "near 0" test); NAN after a failed read
  - id: hw_bridge_count
    type: int
    initial_value: '0'      # resets bridged since the last full-charge anchor —
    restore_value: yes      # printed in CYCLE CONFIRM, cleared at every anchor

  # ── V1.28: SOC from the INA228 CHARGE register ────────────────────────────
  # NVS: 15 more restored values (45 + 12 integrations). NVS is 0x70000 = 112
  # pages [S: generated partitions.csv]; each is one small entry. The bracket
  # accumulators persist in steps (10 mAh / 0.1 Wh), like hw_charge_saved_ah:
  # ~1 save per accumulator per hour at idle [D: 10 mA -> 10 mAh per 60 min].
  - id: hw_prov_anchor_ah
    type: float
    initial_value: 'NAN'    # provisional anchor (review B3). Used only while
    restore_value: yes      # hw_charge_anchor_ah is NAN; a clean full charge replaces it
  - id: soc_anchor_src
    type: int
    initial_value: '0'      # 0 none, 1 full charge, 2 manual, 3 prov. from ledger,
    restore_value: yes      # 4 prov. carried from last CHARGE SOC, 5 prov. assumed 100 %
  - id: brk_clean
    type: bool
    initial_value: 'false'  # the current bracket started at an absorption-confirmed
    restore_value: yes      # full charge (only such brackets feed RECON)
  - id: anchor_epoch
    type: uint32_t
    initial_value: '0'      # HA time of the current anchor; 0 = not yet known
    restore_value: yes
  - id: soc_last_good
    type: float
    initial_value: 'NAN'    # last CHARGE-based SOC, persisted in 0.05 % steps — the
    restore_value: yes      # carry-forward seed after a reset that could not be bridged
  - id: brk_in_saved
    type: float
    initial_value: '0.0'
    restore_value: yes
  - id: brk_out_saved
    type: float
    initial_value: '0.0'
    restore_value: yes
  - id: brk_whin_saved
    type: float
    initial_value: '0.0'
    restore_value: yes
  - id: brk_whout_saved
    type: float
    initial_value: '0.0'
    restore_value: yes
  - id: last_session_ah
    type: float
    initial_value: 'NAN'    # CHARGE Ah into the bank, last charge session (no deadband)
    restore_value: yes
  - id: last_session_wh
    type: float
    initial_value: 'NAN'
    restore_value: yes
  - id: last_closure_ah
    type: float
    initial_value: 'NAN'    # CHARGE SOC error at the last anchor, Ah (>0 = read high)
    restore_value: yes
  - id: last_offset_suggest_ma
    type: float
    initial_value: 'NAN'    # RECON (CHARGE): constant-drain equivalent of U, mA
    restore_value: yes
  - id: hw_lsb_a
    type: float
    initial_value: '3.814697265625e-4'   # the LSB the bridge offsets were built on.
    restore_value: yes      # Initial value = V1.27's 200 A / 2^19, so the first V1.28
                            # boot migrates them to 400 A / 2^19 (on_boot).
  - id: sentinel_established
    type: bool
    initial_value: 'true'   # V1.25-V1.27 wrote the TEMP_LIMIT sentinel on every boot
    restore_value: yes      # (review B2b: a missing sentinel now always = reset)
  # Transient
  - id: brk_in_ah           # live bracket accumulators (seeded from *_saved at boot)
    type: float
    initial_value: '0.0'
    restore_value: no
  - id: brk_out_ah
    type: float
    initial_value: '0.0'
    restore_value: no
  - id: brk_whin
    type: float
    initial_value: '0.0'
    restore_value: no
  - id: brk_whout
    type: float
    initial_value: '0.0'
    restore_value: no
  - id: brk_loaded
    type: bool
    initial_value: 'false'  # *_saved copied into the live accumulators this boot
    restore_value: no
  - id: hw_prev_ah
    type: float
    initial_value: 'NAN'    # previous CHARGE reading; NAN after boot (first delta skipped)
    restore_value: no
  - id: hw_last_good_ms
    type: uint32_t
    initial_value: '0'      # millis() of the last published CHARGE read (B2c)
    restore_value: no
  - id: hw_energy_raw_wh
    type: float
    initial_value: 'NAN'    # raw ENERGY register Wh as last read (LSB migration)
    restore_value: no
  - id: ina_expect_shunt_cal
    type: uint16_t
    initial_value: '0'
    restore_value: no
  - id: ina_expect_adc_config
    type: uint16_t
    initial_value: '0'
    restore_value: no
  - id: ina_expect_valid
    type: bool
    initial_value: 'false'  # set once this boot's readback succeeded (B2a reference)
    restore_value: no
  - id: ina_reset_seen
    type: bool
    initial_value: 'false'  # a runtime reset is acted on once per boot
    restore_value: no
  - id: ina_reset_reboots
    type: int
    initial_value: '0'      # B2a reboots in a row (rate limit); cleared after 1 h of held config
    restore_value: yes
  - id: hours_since_anchor
    type: float
    initial_value: '0.0'
    restore_value: no
  - id: hours_since_anchor_saved
    type: float
    initial_value: '0.0'    # hours_since_anchor as last saved (0.1 h steps): carried across a reboot
    restore_value: yes
  - id: hours_boot_base
    type: float
    initial_value: 'NAN'    # hours_since_anchor - uptime h; seeded from the saved value at boot
    restore_value: no
  - id: soc_unclamped
    type: float
    initial_value: 'NAN'    # CHARGE SOC before the 0..100 clamp (anchor closure)
    restore_value: no
  - id: fb_active
    type: bool
    initial_value: 'false'  # SOC is on the ledger-movement fallback
    restore_value: no
  - id: fb_soc_ref
    type: float
    initial_value: 'NAN'
    restore_value: no
  - id: soc_live
    type: float
    initial_value: 'NAN'    # last CHARGE SOC this boot, unrounded (fallback reference;
    restore_value: no       # soc_last_good is only saved in 0.05 % steps)
  - id: fb_ledger_ref
    type: float
    initial_value: 'NAN'
    restore_value: no
  - id: absorb_tail_min_a
    type: float
    initial_value: 'NAN'    # O2: lowest charge current seen in CV this session
    restore_value: no
  - id: absorb_tail_pending_a
    type: float
    initial_value: 'NAN'    # O2: last CV reading, committed only when the next is CV too
    restore_value: no
  - id: sess_in_start
    type: float
    initial_value: '0.0'
    restore_value: no
  - id: sess_whin_start
    type: float
    initial_value: '0.0'
    restore_value: no


interval:

  # Voltage slope — 60s sampling, EMA α=0.35. Drives knee/cliff sensors.
  - interval: 60s
    then:
      - lambda: |-
          float v_now  = id(ina228_voltage).state;
          float v_then = id(voltage_1min_ago);
          if (!isnan(v_then) && !isnan(v_now)) {
            float raw = (v_now - v_then) * 1000.0f;  // mV/min
            float ema = id(slope_ema);
            if (isnan(ema)) {
              ema = raw;                         // Cold-start: seed from first sample
            } else {
              ema = 0.35f * raw + 0.65f * ema;  // α=0.35 EMA
            }
            id(slope_ema) = ema;
            id(voltage_slope).publish_state(ema);
          }
          id(voltage_1min_ago) = v_now;

  # 5s peak trackers — charge peak (session) and discharge peak (cycle-level).
  - interval: 5s
    then:
      - if:
          condition:
            lambda: 'return id(ina228_current).state > ${charge_threshold_a}f;'
          then:
            - lambda: |-
                float i = id(ina228_current).state;
                if (i > id(charge_peak_a_raw))
                  id(charge_peak_a_raw) = i;   // Most-positive = highest charge A
      # V1.28 (O2): lowest current while in CV (Absorption Phase pressed) =
      # how far the charge tapered before the charger stopped.
      # Review 2026-09-25 (host test S4c): a reading is committed only when the
      # NEXT 5 s reading is also in CV. The one 1.6 s-averaged conversion that
      # straddles a charger stop reads between I_cv and 0 while Absorption Phase
      # is still held on by its 30 s delayed_off; committed directly, a stop at
      # 30 A read 8 A and anchored a false 100 %. The reading after a stop is
      # <= charge_threshold_a, which clears the pending one uncommitted.
      - lambda: |-
          const float i = id(ina228_current).state;
          if (id(battery_fully_charged).state && i > ${charge_threshold_a}f) {
            const float p = id(absorb_tail_pending_a);
            if (!isnan(p) && (isnan(id(absorb_tail_min_a)) || p < id(absorb_tail_min_a)))
              id(absorb_tail_min_a) = p;
            id(absorb_tail_pending_a) = i;
          } else {
            id(absorb_tail_pending_a) = NAN;
          }
      - if:
          condition:
            lambda: 'return id(ina228_current).state < ${discharge_threshold_a}f;'
          then:
            - lambda: |-
                float i = id(ina228_current).state;
                // Most-negative = deepest discharge (I is negative in Option B)
                if (i < id(discharge_peak_a_raw))
                  id(discharge_peak_a_raw) = i;
                // Outage peak load (V1.9): track max discharge power this event.
                // discharge_power is the 1s-reported magnitude (0 when not discharging),
                // so this is the sustained peak, not sub-second inrush (below INA228
                // reporting cadence anyway) — which is what load-shedding planning needs.
                id(outage_elapsed_s) += 5;  // outage wall-clock, 5 s ticks (persisted)
                float pw = id(discharge_power).state;
                if (!isnan(pw) && pw > id(outage_peak_w))
                  id(outage_peak_w) = pw;

  # Apparent Ri (PROVISIONAL) — rest→discharge load steps, settled-step method (V1.20).
  # V1.19 defect: single-tick ΔV/ΔI raced the INA228's SEQUENTIAL channel
  # conversions (VBUS and VSHUNT average different ~0.5 s sub-windows of each
  # 1.58 s cycle). A step landing mid-cycle produced a straddled V/I pair →
  # Ri ~0 or negative → rejected by the sanity band → the one qualifying edge
  # per event was consumed. Capture succeeded only when the step happened to
  # fall between cycles (~coin flip) — hence sample_count == 0 after a
  # textbook 80 A step.
  # V1.20 method: hold a rolling rest baseline (refreshed while |I| <= quiescent);
  # on a step to <= -ri_min_step_a, wait 5 s (>2 driver cycles, both channels
  # fully post-step), then Ri = (V_rest - V_now) / (-I_now). OCV is static over
  # 5 s, so the estimate is unbiased and conversion-phase-immune. One sample
  # per rest→load event (baseline is invalidated after use).
  # V1.25: 45 s dwell kept; gate and evaluation now on 5-20 s / 30-45 s means
  # (same windows as ups-monitor V1.20, so the two devices' Ri series are
  # comparable), Ri = dV/dI, and every reject/abort is logged. Detail inline.
  - interval: 1s
    then:
      - lambda: |-
          float i_now = id(ina228_current).state;
          float v_now = id(ina228_voltage).state;

          bool stale = (millis() > 15000u) &&
                       ((millis() - id(last_ina228_update)) > 10000u);
          if (stale || isnan(i_now) || isnan(v_now)) {
            id(ri_rest_v) = NAN;      // no phantom baselines across a gap
            id(ri_trig_ms) = 0u;
            return;
          }

          if (fabsf(i_now) <= ${ri_quiescent_a}f) {
            // At rest: refresh the baseline; cancel any pending measurement
            // (the load released before it settled — not a valid step).
            // V1.25: an abort is logged — it was silent through V1.24.
            if (id(ri_trig_ms) != 0u)
              ESP_LOGW("bank.ri",
                "Ri settled-step aborted: back at rest %.1f s after arming (I=%.2fA) - no sample for this event",
                (millis() - id(ri_trig_ms)) / 1000.0f, i_now);
            id(ri_rest_v) = v_now;
            id(ri_rest_i) = i_now;    // V1.25: the rest POINT (V, I) — see dV/dI below
            id(ri_rest_ms) = millis();
            id(ri_trig_ms) = 0u;
            return;
          }

          if (id(ri_trig_ms) == 0u) {
            // Loaded, nothing pending: arm only on a deep step from a FRESH rest
            // baseline (< 10 s old — one driver cycle of slack past the step).
            if (!isnan(id(ri_rest_v)) &&
                (millis() - id(ri_rest_ms)) < 10000u &&
                i_now <= -${ri_min_step_a}f) {
              id(ri_trig_ms) = millis();
              id(ri_trig_i) = i_now;
              // V1.25: fresh gate windows for this arm.
              id(ri_trig_isum) = 0.0f; id(ri_trig_n) = 0;
              id(ri_eval_vsum) = 0.0f; id(ri_eval_isum) = 0.0f; id(ri_eval_n) = 0;
            } else if (!isnan(id(ri_rest_v)) && i_now <= -${ri_min_step_a}f) {
              // V1.25: a deep load arrived but the rest reading is >= 10 s old — a
              // STAGED load (2026-07-16 14:22: rest -> -10.4 A for ~10 s -> -40 A;
              // the baseline was 12 s old [M]). Not a clean step; say so ONCE
              // (baseline consumed) instead of skipping silently as through V1.24.
              ESP_LOGW("bank.ri",
                "Ri step not armed: last rest reading %.1f s before this %.1f A load (staged/ramped load?) - no sample for this event",
                (millis() - id(ri_rest_ms)) / 1000.0f, i_now);
              id(ri_rest_v) = NAN;
            }
            return;
          }

          // V1.21: dwell extended 5 s -> 45 s. At 5 s the voltage still slews
          // ~20 mV/s (polarization developing), so samples carried ±20%
          // conversion-phase scatter and read below the ohmic floor (the 1.82
          // mOhm n=2 commissioning samples — discard). At 45 s dV/dt has
          // flattened; expect repeatable ~3.3-3.5 mOhm for aging trends.
          // V1.25 (ported from ups-monitor V1.20, Open Item 20): WINDOWED gate.
          // V1.21 tested the 45 s sample against the ARM sample, and the arm
          // sample is the first poll past -25 A — normally a 1.58 s averaging
          // window the step landed inside. 2026-07-16 17:42: arm -70.83 A vs
          // -79.93 A at 45 s; it passed by 1.45 A [M]. Any arm under 69.6 A of an
          // 80 A step fails [D: 80 / 1.15], and that path logged nothing.
          // Now: mean I over 5-20 s after arming is the reference, mean over
          // 30-45 s is the test, and Ri uses the 30-45 s means of V and I.
          uint32_t el = millis() - id(ri_trig_ms);
          if (el >= 5000u && el < 20000u) {
            id(ri_trig_isum) += i_now; id(ri_trig_n)++;
          }
          if (el >= 30000u && el < 45000u) {
            id(ri_eval_vsum) += v_now; id(ri_eval_isum) += i_now; id(ri_eval_n)++;
          }
          if (el >= 45000u) {
            id(ri_trig_ms) = 0u;
            float rest_v = id(ri_rest_v);
            float rest_i = id(ri_rest_i);
            id(ri_rest_v) = NAN;      // one sample per rest→load event
            float ref_i = id(ri_trig_n) > 0 ? id(ri_trig_isum) / id(ri_trig_n) : NAN;
            float i_ev  = id(ri_eval_n) > 0 ? id(ri_eval_isum) / id(ri_eval_n) : NAN;
            float v_ev  = id(ri_eval_n) > 0 ? id(ri_eval_vsum) / id(ri_eval_n) : NAN;
            // Stability gate (V1.21): reject ramping loads — current at maturity
            // must be within ±15% of the trigger current (heater inrush decay
            // passes at ~2%; a dryer-style ramp or trip mid-dwell fails).
            // V1.25: "maturity" is now the 30-45 s mean and "trigger" the 5-20 s
            // mean (17:42: -79.48 A vs -80.06 A = 0.7 % [D], on the M series).
            bool stable = !isnan(ref_i) && !isnan(i_ev) &&
                          fabsf(i_ev - ref_i) <= 0.15f * fabsf(ref_i);
            if (!(i_ev <= -${ri_min_step_a}f && !isnan(rest_v) && !isnan(rest_i) && stable)) {
              ESP_LOGW("bank.ri",
                "Ri settled-step rejected (unstable/unloaded): arm I=%.2fA | 5-20 s mean %.2fA (n=%d) | 30-45 s mean %.2fA (n=%d) | Vrest=%.4f",
                id(ri_trig_i), ref_i, id(ri_trig_n), i_ev, id(ri_eval_n), rest_v);
              return;
            }
            // V1.25: Ri = dV/dI between the rest point and the loaded point —
            // was dV/(-I_load), low by I_rest/I_load whenever the rest point
            // carried current (inverter idle; up to 5 A). This also makes a
            // straddled rest sample harmless: its V and I dip by the SAME
            // fraction (17:42: -0.40 A / 13.3107 V [M]), a point on the load line.
            float ri = ((rest_v - v_ev) / (rest_i - i_ev)) * 1000.0f;   // mΩ
            if (ri >= ${ri_min_mohm}f && ri <= ${ri_max_mohm}f) {
              float t = id(battery_temp).state;   // °F — tag for trend normalization
              id(ri_sample_count) += 1;
              id(last_ri_mohm) = ri;      // persist: value restored after reboot/OTA
              id(last_ri_temp_f) = t;
              id(apparent_ri).publish_state(ri);
              id(apparent_ri_temp).publish_state(t);
              ESP_LOGI("bank.ri",
                "Apparent Ri=%.3f mOhm (settled-step, 30-45 s means) | Vrest=%.4f Irest=%.2fA | Vload=%.4f Iload=%.2fA | T=%.1fF | n=%d",
                ri, rest_v, rest_i, v_ev, i_ev,
                isnan(t) ? -999.0f : t, id(ri_sample_count));
            } else {
              ESP_LOGW("bank.ri",
                "Ri settled-step rejected (out of band): %.3f mOhm | Vrest=%.4f Irest=%.2fA | Vload=%.4f Iload=%.2fA",
                ri, rest_v, rest_i, v_ev, i_ev);
            }
          }

  # Status-LED pattern driver (V1.19 semantics). 250 ms base tick:
  # fast = toggle every tick (2 Hz); slow = 4 ticks on / 4 off (0.5 Hz); solid = on.
  # FAULT predicate mirrors bank_state (single source of truth, published 5 s).
  # Idle = SLOW flash (proof-of-life); charge/discharge = SOLID; FAULT = FAST.
  - interval: 250ms
    then:
      - lambda: |-
          static uint8_t tick = 0;
          tick = (tick + 1) & 0x07;
          bool fault  = id(bank_state).has_state() &&
                        id(bank_state).state == "FAULT";
          bool active = id(is_charging).state || id(is_discharging).state;
          bool on = (tick < 4);                // slow flash: idle, no faults (proof-of-life)
          if (fault)        on = (tick & 1);   // fast flash — FAULT
          else if (active)  on = true;         // solid — charge/discharge in progress
          if (on) id(led_out).turn_on(); else id(led_out).turn_off();

  # V1.28: what the Wi-Fi driver is actually doing (B1: modem sleep despite
  # power_save_mode: none; TX cap 11 dBm). esp_wifi_* fail before Wi-Fi starts.
  - interval: 300s
    then:
      - lambda: |-
          wifi_ps_type_t ps;
          const char *m = "ERR";
          if (esp_wifi_get_ps(&ps) == ESP_OK)
            m = (ps == WIFI_PS_NONE) ? "NONE" :
                (ps == WIFI_PS_MIN_MODEM) ? "MIN_MODEM (modem sleep, DTIM)" :
                (ps == WIFI_PS_MAX_MODEM) ? "MAX_MODEM (modem sleep, listen interval)" : "OTHER";
          id(wifi_ps_readback).publish_state(m);
          int8_t q = 0;
          if (esp_wifi_get_max_tx_power(&q) == ESP_OK)
            id(wifi_txp_readback).publish_state(q * 0.25f);   // 0.25 dBm units

  # 60s health log — single-line diagnostic snapshot.
  - interval: 60s
    then:
      - lambda: |-
          float v    = id(ina228_voltage).state;
          float i    = id(ina228_current).state;
          float soc  = id(soc_estimate).state;
          float lout = id(ah_discharged_lifetime).state;
          float lin  = id(ah_charged_lifetime).state;
          if (!isnan(v) && !isnan(i)) {
            std::string state = id(bank_state).has_state() ? id(bank_state).state : "?";
            ESP_LOGI("bank",
              "[%s] V=%.3fV I=%.3fA (%.1fW net) | SOC~%.1f%% | Lifetime: out=%.1fAh in=%.1fAh | Cycles: %d",
              state.c_str(), v, i, v * fabs(i),
              isnan(soc) ? -1.0f : soc,
              isnan(lout) ? -1.0f : lout,
              isnan(lin)  ? -1.0f : lin,
              id(total_full_charge_count));
          }


sensor:

  # INA228: V/I/P. 375µΩ shunt, adc_range=0 mandatory (clips at 109A on range 1).
  # Positive I = charging, negative = discharging (Option B — see header).
  # Shunt step ~0.83mA (312.5nV LSB ÷ 375µΩ); 50mA threshold is ~60× step.
  - platform: ina2xx_i2c
    model: INA228
    address: 0x40
    shunt_resistance: 0.000375 ohm # Ω (375 µΩ = 75 mV / 200 A) — unit suffix required per ESPHome docs example
    max_current: ${ina_max_current_a} A   # V1.28: 400 A (was 200 A). Unit suffix required. Sets
                                   # CURRENT_LSB = 400 / 2^19 = 0.763 mA, still finer than the ADC's
                                   # own 0.833 mA step (312.5 nV / 375 µΩ), so nothing is lost; and
                                   # the 350 A plausibility guard can now trip (±200 A range could not).
    adc_range: 0                   # 0 = ±163.84 mV full scale (mandatory); 1 = ±40.96 mV (clips at ~109 A)
    reset_on_boot: false           # LOAD-BEARING since V1.28: SOC is the CHARGE register against an
                                   # anchor. Resetting the accumulators at boot would restart CHARGE
                                   # at 0 on every reboot and invalidate the anchor each time.
    # V1.28: 0xFDC5 — bus 2074 µs, shunt 4120 µs, temperature 50 µs, AVG 256.
    # Cycle = 256 × (2074+4120+50) µs = 1.598 s (was 128 × 3 × 4120 µs = 1.582 s);
    # 2 s > 1.598 s, so every poll is still a fresh sample. Shunt integration per
    # reading doubles (0.527 -> 1.055 s): diag2 TB-5 sd ratio 0.735 [M], predicted
    # 1/√2. Bus time per reading unchanged (0.527 -> 0.531 s). CHARGE and ENERGY
    # accumulate per conversion, so AVG does not touch them (TB-3: Q flat, AVG 1-128).
    adc_time:
      bus_voltage: 2074us
      shunt_voltage: 4120us
      temperature: 50us
    adc_averaging: 256
    update_interval: 2s
    current:
      name: "Battery Current"
      id: ina228_current
      unit_of_measurement: "A"
      accuracy_decimals: 3
      device_class: current
      state_class: measurement
      # Positive = charging, negative = discharging (Option B)
    bus_voltage:
      name: "Battery Voltage"
      id: ina228_voltage
      unit_of_measurement: "V"
      accuracy_decimals: 3
      device_class: voltage
      state_class: measurement
      # Drop out-of-range readings — sustained garbage stops on_value, watchdog trips FAULT.
      filters:
        - lambda: |-
            if (x < ${v_min_plausible}f || x > ${v_max_plausible}f) return {};  // drop: out of physical range
            return x;
      # on_value feeds watchdog timestamp every ~2s (well within 10s FAULT threshold).
      on_value:
        - lambda: 'id(last_ina228_update) = millis();'
    power:
      name: "INA228 Power Register"
      id: ina228_power
      internal: true             # magnitude only; signed_power template is the HA-facing sensor
      unit_of_measurement: "W"
      accuracy_decimals: 1
      device_class: power
      state_class: measurement
      # LSB = 3.2 × CURRENT_LSB ≈ 2.44 mW at 400 A (V1.28; 1.22 mW at 200 A).
    temperature:
      name: "INA228 Die Temperature"
      id: ina228_die_temp
      unit_of_measurement: "°C"
      accuracy_decimals: 1
      device_class: temperature
      entity_category: diagnostic
      filters:
        - throttle_average: 60s

  # DS18B20 — battery pack temperature (°F). Mount against battery case.
  - platform: dallas_temp
    name: "Battery Pack Temperature"
    id: battery_temp
    update_interval: 60s
    accuracy_decimals: 1
    unit_of_measurement: "°F"
    device_class: temperature
    state_class: measurement
    filters:
      - filter_out: 85.0           # DS18B20 power-on reset artefact (raw °C value).
                                   # Runs before the °C→°F lambda — intentional ordering.
                                   # Also drops a genuine 85.0°C reading; acceptable
                                   # (185°F is far outside any plausible basement temp).
      - filter_out: -127.0         # DS18B20 short-to-ground failure (raw °C value)
      - lambda: return x * 1.8 + 32.0;   # °C → °F conversion

  # Discharge current magnitude (internal) — feeds Ah integration. Returns |I| when
  # discharging (Option B: I < −0.05A), 0.0 otherwise. Stale-bus + plausibility guarded.
  - platform: template
    name: "Discharge Current Magnitude"
    id: discharge_current
    internal: true
    unit_of_measurement: "A"
    accuracy_decimals: 3
    lambda: |-
      float i = id(ina228_current).state;
      // Stale-bus guard: freeze integration if no INA228 read >10s after boot grace.
      if (millis() > 15000u && (millis() - id(last_ina228_update)) > 10000u) return 0.0f;
      if (isnan(i) || fabsf(i) > ${i_max_plausible_a}f) return 0.0f;
      if (i > ${discharge_threshold_a}f) return 0.0f;
      return -i;
    update_interval: 1s

  # Discharge power magnitude (internal) — POWER register, not V×I (±0.61mW vs ±2.5mW).
  - platform: template
    name: "Discharge Power Magnitude"
    id: discharge_power
    internal: true
    unit_of_measurement: "W"
    accuracy_decimals: 1
    lambda: |-
      // V1.24: power = V x I from the AVERAGED SIGNED registers, not the chip
      // POWER register. The POWER register rectifies per raw conversion
      // (unsigned product each 4.12 ms sample, THEN averaged), so near-zero
      // current it reads the rectified raw-noise floor (~1 W at this shunt) —
      // averaging cannot cancel magnitudes. V x I of the 128-averaged signed
      // registers is accurate at idle (~0.09 W) and identical under load.
      float i = id(ina228_current).state;
      float v = id(ina228_voltage).state;
      if (millis() > 15000u && (millis() - id(last_ina228_update)) > 10000u) return 0.0f;
      if (isnan(i) || isnan(v) || fabsf(i) > ${i_max_plausible_a}f) return 0.0f;
      if (i > ${discharge_threshold_a}f) return 0.0f;
      return v * (-i);   // positive W while discharging (i negative)
    update_interval: 1s

  # Wh discharged this cycle — feeds mean_discharge_v = Wh/Ah (current-weighted mean V).
  - platform: integration
    name: "Wh Discharged (This Cycle)"
    id: wh_discharged_cycle
    sensor: discharge_power
    time_unit: h
    unit_of_measurement: "Wh"
    accuracy_decimals: 2
    integration_method: left    # area = previous_value × dt; 0.0f source → 0 area always
    state_class: measurement    # Resets at full charge — same as Ah cycle counters
    restore: true

  # Charge current magnitude (internal) — feeds Ah integration.
  - platform: template
    name: "Charge Current Magnitude"
    id: charge_current
    internal: true
    unit_of_measurement: "A"
    accuracy_decimals: 3
    lambda: |-
      float i = id(ina228_current).state;
      if (millis() > 15000u && (millis() - id(last_ina228_update)) > 10000u) return 0.0f;
      if (isnan(i) || fabsf(i) > ${i_max_plausible_a}f) return 0.0f;
      if (i < ${charge_threshold_a}f) return 0.0f;
      return i;
    update_interval: 1s

  # Charge power magnitude (internal) — POWER register source.
  - platform: template
    name: "Charge Power Magnitude"
    id: charge_power
    internal: true
    unit_of_measurement: "W"
    accuracy_decimals: 1
    lambda: |-
      // V1.24: V x I product — see discharge_power rationale.
      float i = id(ina228_current).state;
      float v = id(ina228_voltage).state;
      if (millis() > 15000u && (millis() - id(last_ina228_update)) > 10000u) return 0.0f;
      if (isnan(i) || isnan(v) || fabsf(i) > ${i_max_plausible_a}f) return 0.0f;
      if (i < ${charge_threshold_a}f) return 0.0f;
      return v * i;
    update_interval: 1s

  # Signed power — V1.24: V x I from averaged signed registers (accurate at idle,
  # ~0.09 W self-draw). The chip POWER register rectifies per raw conversion and
  # floors at ~1 W near zero current (see discharge_power note); it remains
  # exposed as "INA228 Power (register)" for the energy-path caveat only.
  - platform: template
    name: "Battery Power"
    id: signed_power
    unit_of_measurement: "W"
    accuracy_decimals: 3   # mW resolution: idle self-draw (~0.09 W) visible in HA
    device_class: power
    state_class: measurement
    lambda: |-
      float v = id(ina228_voltage).state;
      float i = id(ina228_current).state;
      if (isnan(v) || isnan(i)) return NAN;
      return v * i;   // sign convention carried by i (charge +, discharge −)
    update_interval: 1s

  # Ah/Wh cycle counters (reset at full charge) and lifetime counters (manual reset only).
  # restore: true — bank powers monitor; reboot must not lose Coulomb count.
  - platform: integration
    name: "Ah Discharged (This Cycle)"
    id: ah_discharged_cycle
    sensor: discharge_current
    time_unit: h
    unit_of_measurement: "Ah"
    accuracy_decimals: 2
    integration_method: left    # area = previous_value × dt; 0.0f source → 0 area always
    state_class: measurement    # NOT total_increasing — resets at full charge; HA handles correctly
    restore: true

  - platform: integration
    name: "Ah Charged (This Cycle)"
    id: ah_charged_cycle
    sensor: charge_current
    time_unit: h
    unit_of_measurement: "Ah"
    accuracy_decimals: 2
    integration_method: left    # area = previous_value × dt; 0.0f source → 0 area always
    state_class: measurement
    restore: true

  # Self-discharge model: equivalent constant current at self_discharge_pct_per_month
  # rate. Default 0.0 = inert. Separate from discharge_current to keep measurement pure.
  - platform: template
    name: "Self-Discharge Equivalent Current"
    id: self_discharge_equiv_current
    unit_of_measurement: "A"
    accuracy_decimals: 4
    icon: "mdi:battery-minus-outline"
    entity_category: diagnostic
    lambda: |-
      // (rate%/month ÷ 100) × capacity_Ah ÷ 730.5 h/month = equivalent amps.
      // 730.5 h = 30.4375 days × 24 h (mean month). Constant; 0.0 when rate is 0.
      return (${self_discharge_pct_per_month}f / 100.0f)
             * ${validated_capacity_ah}f / 730.5f;
    update_interval: 60s

  - platform: integration
    name: "Self-Discharge Ah (This Cycle)"
    id: self_discharge_ah
    sensor: self_discharge_equiv_current
    time_unit: h
    unit_of_measurement: "Ah"
    accuracy_decimals: 3
    integration_method: left
    state_class: measurement    # Resets at full charge alongside the cycle counters.
    restore: true

  # Per-outage Ah/Wh (OBSERVABILITY). restore: true — survives brownout-reboot.
