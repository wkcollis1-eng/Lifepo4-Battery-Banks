#           NO impact on CORE acquisition/alarms/SOC: the display only READS published
#             states; it never writes the alarm path, state machine, or SOC. A display or
#             button fault cannot affect backup readiness.
#   V1.13 — Robustness pass for the MANUAL / data-driven operating model (no HA
#           control of the bank; operator reads SOC and manually opens the transfer
#           switch / panel breakers at ~20% SOC). In this model the DATA is the
#           safety system, so this pass hardens SOC integrity, SOC visibility, and
#           recovery — NOT alarm actuation (the alarms drive no automated action here).
#           (1) CURRENT-CHANNEL HEALTH + PLAUSIBILITY (SOC integrity — primary):
#               - New substitutions v_min_plausible / v_max_plausible (8 / 16 V) and
#                 i_max_plausible_a (350 A). 350 A clears the 200 A shunt rating and any
#                 real AVERAGED reading (sub-second inverter surges are averaged down by
#                 the 128x / ~1.58 s conversion, so a sustained ≥350 A reading is
#                 non-physical) while sitting below the ~437 A ADC ceiling, so it catches
#                 a saturated/garbage current channel — including the high-side
#                 open-Kelvin-lead failure, whose floating differential input rails high.
#               - Bus voltage: a lambda filter DROPS out-of-range readings (returns {}).
#                 A single glitch is silently rejected (state holds one cycle); sustained
#                 garbage produces no on_value callbacks, so the EXISTING stale-bus
#                 watchdog trips FAULT at 10 s. Every downstream consumer already guards
#                 isnan / stale, so this one filter protects them all without new code.
#               - Current: the 4 SOC integration sources (discharge/charge current+power)
#                 now FREEZE (return 0.0f) when fabsf(I) > i_max_plausible_a, alongside the
#                 existing V1.7 stale-bus guard. Current is NOT drop-filtered (a dropped/
#                 held current would keep integrating a STUCK value — the exact silent
#                 drift this is meant to stop), so the bound is enforced inline on the
#                 integration path instead.
#               - bank_state gains the same current bound in its FAULT condition, so the
#                 operator's primary state indicator shows FAULT (do-not-trust-SOC) when
#                 the current channel is implausible.
#               - New diagnostic binary_sensor "Current Channel Fault" for dashboard
#                 visibility (5 s delayed_on rejects transients).
#               HONEST LIMIT (documented, not papered over): a current channel that fails
#               by reading PLAUSIBLY-but-WRONG (e.g. a partial/high-resistance Kelvin
#               connection giving a believable-but-incorrect value) is NOT detectable by
#               bounds. Mitigation is the quarterly ELECTRICAL sense-fuse/Kelvin check in
#               the wiring doc (made functional, not just visual) and the periodic §7.1
#               calibration cross-check against a clamp meter.
#           (5) REBOOT-TIMEOUT for continuous local operation: wifi reboot_timeout and
#               api reboot_timeout both set to 0 s (disabled). Rationale: in the manual
#               model the device's value is CONTINUOUS local SOC publishing; a WiFi blip
#               or a long (>30 min) outage with HA briefly unreachable must NOT blank the
#               readout via a reboot. Recovery from a genuinely wedged stack now relies on
#               safe_mode (crash-loop recovery, below) plus a manual feed power-cycle,
#               which is always available on a manual system. (If a wedge-recovery net is
#               preferred over pure continuity, set a long FINITE timeout, e.g. 4h, rather
#               than 0 — see the api/wifi blocks.)
