#                 supports the chosen scheme, and bench-test a full OTA round-trip before
#                 relying on it. Tracked as a sequenced commissioning to-do.
#           NOTE: NVS flash-wear question (raised in review) resolved — ESPHome batches
#               all restore/preference writes and flushes them as one NVS transaction on
#               preferences: flash_write_interval (default 60 s), wear-leveled, and NVS
#               survives power loss. So the seven restore integrators + globals cost ~1
#               batched write/min, not per-update; multi-year wear is fine. The knob
#               (preferences: flash_write_interval) is available if a longer interval is
#               ever wanted; not changed here.
#   V1.12 — INA228 conversion-cadence correction + doc/firmware alignment pass:
#           CADENCE (the substantive change): update_interval 1s -> 2s, and
#             adc_time / adc_averaging now pinned EXPLICITLY (4120us, 128) rather
#             than inherited from ESPHome defaults. Reason: at the default 128x
#             averaging the INA228's full averaged-conversion cycle is
#               cycle = adc_averaging × (VSHCT + VBUSCT + VTCT)
#                     = 128 × (4120 + 4120 + 4120) µs ≈ 1.58 s
#             (three channels enabled because the temperature sub-sensor is
#             configured). The old update_interval: 1s therefore polled the device
#             ~1.6× faster than it produced a fresh averaged sample, so ~40% of
#             reads returned a still-converting (repeat) value. This never hurt the
#             dt-based integrals (integration_method: left integrates a held value
#             over the correct elapsed dt) or the watchdog (publish still fires each
#             poll), but it made the repeated "1s native rate" comments inaccurate.
#             128x averaging is RETAINED deliberately — it keeps the noise floor far
#             below the 0.05 A threshold, which is what makes the ~100 mA self-draw
#             capture and the sub-mAh self-discharge reconciliation clean. This
#             bank's dynamics are slow (slope 60s, SOC 30s, alarms debounce 10-60s),
#             so sub-second sampling buys nothing; halving averaging to chase 1s
#             would only raise noise on exactly the low-current paths this design
#             cares about. update_interval: 2s sits safely above the 1.58 s cycle so
#             every poll now returns a genuinely fresh averaged sample. Pinning
#             adc_time/adc_averaging also removes a hidden dependency on ESPHome
#             defaults (which can change between releases) for a watchdog-timed config.
#             NOTE: the integration-source template sensors and signed_power keep
#             update_interval: 1s — they read the held INA228 value and integrate it
#             correctly regardless; their cadence does not need to match the device.
