#             BUSOL (bus over-voltage):  14.80 V — matches overvoltage_threshold
#             SHNTOL (shunt over-limit): 250 A equivalent (93.75 mV, 25% above rating)
#             POL (power over-limit):    1500 W — Giandel inverter rated output
#           DIAG_ALRT = 0xA0B8: ALATCH=1 (latched), SLOWALERT=1 (post-averaging),
#           APOL=0 (active-low, matches R2 pull-up topology).
#           GPIO5 binary_sensor fires on FALLING edge (active-low interrupt).
#           on_press handler: reads DIAG_ALRT via I2C (clears latch), decodes
#           which bit(s) fired, logs at WARN, publishes alert_reason text sensor.
#           alert_reason text sensor added to text_sensor block.
#           Alert limit register values added as substitutions for auditability.
#           No SOC logic, display, or wiring changes.
