  # SOC (V1.28): INA228 CHARGE register against an anchor, review B3 ladder:
  #   1 confirmed anchor - absorption-confirmed full charge (tapered, O2) or the
  #     manual button;
  #   2 provisional anchor - seeded so SOC is continuous at that instant: from
  #     the last CHARGE SOC (after a reset that could not be bridged), else from
  #     the SW ledger (first V1.28 boot: the ledger then reads high by its own
  #     error until the next full charge - never baked in, "SOC Source" says so);
  #   3 SW-ledger MOVEMENT from the last CHARGE SOC, only while CHARGE is invalid
  #     (B2c: no good read for 180 s, or this boot's check has not run);
  #   never NAN (turnover §5 decision 1).
  # net = (hw - A) + (CE - 1) x Ah_in since A - I_off x h - SD model
  # SOC = 100 + net / C x 100, clamped 0..100.
  # Driven by hw_charge_ah's on_value (no poll-to-poll lag, turnover decision 3)
  # and by its own 30 s poll (fallback, text).
  - platform: template
    name: "State of Charge"
    id: soc_estimate
    unit_of_measurement: "%"
    accuracy_decimals: 1
    icon: "mdi:battery"
    device_class: battery
    state_class: measurement
    lambda: |-
      const float C = ${validated_capacity_ah}f;
      float sd = id(self_discharge_ah).state;
      if (isnan(sd)) sd = 0.0f;
      // SW ledger SOC (the V1.27 formula): reference and fallback.
      float lo = id(ah_discharged_cycle).state, li = id(ah_charged_cycle).state;
      float ledger = (isnan(lo) || isnan(li)) ? NAN : 100.0f - ((lo - li + sd) / C * 100.0f);
      if (!isnan(ledger)) ledger = ledger > 100.0f ? 100.0f : (ledger < 0.0f ? 0.0f : ledger);
      // Hours since the anchor (HA time); late-seed the epoch if it was unknown.
      // Review 2026-09-25: carried across a reboot. Until HA time is valid the
      // hours run on from the saved value (0.1 h steps) plus uptime - they
      // were 0, which dropped the I_off term - and a late-seeded epoch keeps
      // the hours already run. (host test S10)
      {
        auto t = id(ha_time).now();
        bool anchored = !isnan(id(hw_charge_anchor_ah)) || !isnan(id(hw_prov_anchor_ah));
        const float up_h = (float) millis() / 3600000.0f;
        if (anchored && isnan(id(hours_boot_base))) id(hours_boot_base) = id(hours_since_anchor_saved);
        if (t.is_valid()) {
          uint32_t now = (uint32_t) t.timestamp;
          if (anchored && id(anchor_epoch) == 0u)
            id(anchor_epoch) = now - (uint32_t) ((id(hours_boot_base) + up_h) * 3600.0f);
          if (id(anchor_epoch) != 0u && now >= id(anchor_epoch)) {
            id(hours_since_anchor) = (float) (now - id(anchor_epoch)) / 3600.0f;
            id(hours_boot_base) = id(hours_since_anchor) - up_h;
          }
        } else if (anchored) {
          id(hours_since_anchor) = id(hours_boot_base) + up_h;
        }
        if (anchored && fabsf(id(hours_since_anchor) - id(hours_since_anchor_saved)) >= 0.1f)
          id(hours_since_anchor_saved) = id(hours_since_anchor);
      }
      float hw = id(hw_charge_ah).state;
      bool fresh = id(hw_anchor_checked) && id(hw_last_good_ms) != 0u &&
                   (millis() - id(hw_last_good_ms)) < 180000u && !isnan(hw);   // B2c
      float soc;
      int code;   // SOC Source: 1-5 = anchor source (CHARGE), 6/7 = fallback
      if (fresh) {
        id(fb_active) = false;
        if (isnan(id(hw_charge_anchor_ah)) && isnan(id(hw_prov_anchor_ah))) {
          // B3: provisional anchor, seeded so SOC is continuous right now.
          float seed; int src;
          if (!isnan(id(soc_last_good))) { seed = id(soc_last_good); src = 4; }
          else if (!isnan(ledger))       { seed = ledger;            src = 3; }
          else                            { seed = 100.0f;            src = 5; }
          float a_p = hw - sd - (seed - 100.0f) / 100.0f * C;   // net(a_p) = seed - 100 %
          id(soc_anchor_set).execute(a_p, src, false);
          ESP_LOGW("bank.soc",
            "Provisional SOC anchor at %.2f%% from %s (CHARGE %.4f Ah, anchor %.4f Ah) - an absorption-confirmed full charge replaces it",
            seed, src == 4 ? "the last INA228 CHARGE SOC" : (src == 3 ? "the SW ledger" : "NO reference (assumed full)"),
            hw, a_p);
        }
        float a = !isnan(id(hw_charge_anchor_ah)) ? id(hw_charge_anchor_ah) : id(hw_prov_anchor_ah);
        float net = (hw - a)
                  + (${recon_coul_eff}f - 1.0f) * id(brk_in_ah)        // O1: CE on charge in
                  - ${soc_offset_ma}f / 1000.0f * id(hours_since_anchor)   // I_off
                  - sd;                                                // SD model (inert at 0)
        float unc = 100.0f + net / C * 100.0f;
        id(soc_unclamped) = unc;
        soc = unc > 100.0f ? 100.0f : (unc < 0.0f ? 0.0f : unc);
        id(soc_live) = soc;
        if (isnan(id(soc_last_good)) || fabsf(soc - id(soc_last_good)) >= 0.05f)
          id(soc_last_good) = soc;   // persisted in 0.05 % steps (~20 h apart at idle)
        code = id(soc_anchor_src);
      } else {
        id(soc_unclamped) = NAN;
        if (!id(fb_active)) {
          id(fb_active) = true;
          id(fb_soc_ref) = !isnan(id(soc_live)) ? id(soc_live) : id(soc_last_good);
          id(fb_ledger_ref) = ledger;
        }
        if (!isnan(id(fb_soc_ref)) && !isnan(ledger) && !isnan(id(fb_ledger_ref))) {
          soc = id(fb_soc_ref) + (ledger - id(fb_ledger_ref));
          soc = soc > 100.0f ? 100.0f : (soc < 0.0f ? 0.0f : soc);
          code = 6;
        } else if (!isnan(id(fb_soc_ref))) { soc = id(fb_soc_ref); code = 6; }
        else if (!isnan(ledger))           { soc = ledger;         code = 7; }
        else return {};   // nothing at all yet (first 0.2 s of a first boot): hold, never NAN
      }
      static int last_code = -1;
      if (code != last_code) {
        last_code = code;
        const char *t =
          code == 1 ? "INA228 CHARGE - anchored at a full charge" :
          code == 2 ? "INA228 CHARGE - anchored by the manual Mark-as-Full button" :
          code == 3 ? "INA228 CHARGE - provisional anchor from the SW ledger (reads high by the ledger's error until the next full charge)" :
          code == 4 ? "INA228 CHARGE - provisional anchor carried from the last CHARGE SOC (INA228 reset not bridged)" :
          code == 5 ? "INA228 CHARGE - provisional anchor ASSUMED 100% (no reference)" :
          code == 6 ? "SW ledger movement from the last CHARGE SOC - INA228 CHARGE invalid" :
          code == 7 ? "SW ledger - INA228 CHARGE invalid and no CHARGE SOC yet" : "unknown";
        id(soc_source).publish_state(t);
        ESP_LOGI("bank.soc", "SOC source -> %s", t);
      }
      return soc;
    update_interval: 30s

  # V1.28: the V1.27 SW ledger SOC, kept for comparison (and as the fallback's
  # movement). Deadbanded at ±50 mA: it books ~none of the idle drain.
  - platform: template
    name: "SOC (SW Ledger)"
    id: soc_ledger_sensor
    unit_of_measurement: "%"
    accuracy_decimals: 1
    icon: "mdi:battery-outline"
    entity_category: diagnostic
    state_class: measurement
    lambda: |-
      float ah_out = id(ah_discharged_cycle).state;
      float ah_in  = id(ah_charged_cycle).state;
      if (isnan(ah_out) || isnan(ah_in)) return NAN;
      float sd = id(self_discharge_ah).state;
      if (isnan(sd)) sd = 0.0f;
      float soc = 100.0f - ((ah_out - ah_in + sd) / ${validated_capacity_ah}f * 100.0f);
      if (soc > 100.0f) soc = 100.0f;
      if (soc <   0.0f) soc = 0.0f;
      return soc;
    update_interval: 60s

  # Runtime remaining at current discharge rate. NaN when not discharging.
  - platform: template
    name: "Runtime Remaining"
    id: runtime_hours
    unit_of_measurement: "h"
    accuracy_decimals: 1
    icon: "mdi:battery-clock"
    lambda: |-
      float i = id(ina228_current).state;
      // Option B: discharging = I negative; not discharging if I > discharge_threshold
      if (isnan(i) || i > ${discharge_threshold_a}f) return NAN;
      float soc = id(soc_estimate).state;
      if (isnan(soc) || soc <= 0.0f) return 0.0f;
      float ah_remaining = (soc / 100.0f) * ${validated_capacity_ah}f;
      float hours = ah_remaining / (-i);  // -i: negative discharge I → positive rate
      // Cap at 720h (30 days) — sub-100mA loads give meaningless multi-year values.
      return (hours > 720.0f) ? 720.0f : hours;
    update_interval: 60s

  - platform: template
    name: "Runtime Remaining Days"
    id: runtime_days
    unit_of_measurement: "days"
    accuracy_decimals: 1
    icon: "mdi:battery-clock"
    lambda: |-
      float h = id(runtime_hours).state;
      if (isnan(h)) return NAN;
      return h / 24.0f;
    update_interval: 60s

  # Voltage slope (mV/min) — published by 60s interval, EMA-smoothed.
  - platform: template
    name: "Voltage Slope"
    id: voltage_slope
    unit_of_measurement: "mV/min"
    accuracy_decimals: 2
    icon: "mdi:trending-down"
    state_class: measurement

  # Apparent Ri — event-published on qualifying steps AND lambda-backed by the
  # persisted last-sample globals (V1.22), so the value survives reboot/OTA
  # instead of reverting to Unknown while its sample counter persisted.
  - platform: template
    name: "Apparent Ri"
    id: apparent_ri
    unit_of_measurement: "mΩ"
    accuracy_decimals: 2
    icon: "mdi:omega"
    state_class: measurement
    entity_category: diagnostic
    lambda: 'return id(last_ri_mohm);'   # NAN (Unknown) until first valid sample
    update_interval: 60s

  - platform: template
    name: "Apparent Ri Pack Temp"
    id: apparent_ri_temp
    unit_of_measurement: "°F"
    accuracy_decimals: 1
    icon: "mdi:thermometer"
    device_class: temperature
    state_class: measurement
    entity_category: diagnostic
    lambda: 'return id(last_ri_temp_f);'
    update_interval: 60s

  # ── V1.23: INA228 hardware accumulators via RAW register reads ─────────────
  # V1.28: HW Net Charge is now CORE — it sources SOC (soc_estimate). The text
  # below describes its V1.23 origin as a cross-check.
  # Independent integration-method cross-check for the coulomb ledger: silicon
  # accumulates every 1.58 s conversion continuously; firmware integrates 2 s
  # left-rectangle with 0.05 A deadbands. Divergence = software integration
  # error (deadband + cadence), the term under the CE calculation.
  # RAW reads on bus_a deliberately — configuring the driver's energy:/charge:
  # sub-sensors would make it read DIAG_ALRT every cycle and destroy the ALERT
  # latch ownership (see alert handler). Plain register reads touch no latch.
  # Conversion per ESPHome ina2xx_base source: CURRENT_LSB = max_current / 2^19.
  # V1.28: from the ina_max_current_a substitution (400 A -> 7.62939453125e-4 A;
  # V1.27 hard-coded 200 A's 3.814697265625e-4). Charge[C] = signed40(REG 0x0A)
  # x CURRENT_LSB; Energy[J] = 51.2 x CURRENT_LSB x unsigned40(REG 0x09). 40-bit
  # span at 400 A = ±116,000 Ah: overflow is a non-issue.
  # V1.26: both report register + a persisted offset, so a bridged INA228
  # power-on reset (on_boot) continues the series instead of restarting at 0.
  - platform: template
    name: "HW Net Charge (INA228)"
    id: hw_charge_ah
    unit_of_measurement: "Ah"
    accuracy_decimals: 4
    icon: "mdi:battery-sync"
    state_class: measurement
    entity_category: diagnostic
    lambda: |-
      // V1.28 (review B2a): runtime INA228 reset check, every poll, BEFORE CHARGE
      // is read or saved. A POR restores SHUNT_CAL 1000h, ADC_CONFIG FB68h and
      // TEMP_LIMIT 7FFFh [S: SLYS021A §7.6.1]; every current then reads 4096 /
      // 3750 = 1.09x off and CHARGE restarts at 0 — silently, because the
      // watchdog watches bus voltage. On a mismatch: publish nothing, save
      // nothing, say so, and reboot; the boot check then bridges from the saved
      // value. An unreadable register only skips this poll (B2c ages it out).
      if (id(ina_expect_valid)) {
        auto rd16 = [](uint8_t r, uint16_t &out) -> bool {
          uint8_t bb[2] = {0, 0};
          if (id(bus_a).write(0x40, &r, 1, false) != i2c::ERROR_OK) return false;
          if (id(bus_a).read(0x40, bb, 2) != i2c::ERROR_OK) return false;
          out = ((uint16_t) bb[0] << 8) | bb[1];
          return true;
        };
        uint16_t sc = 0, ac = 0, tl = 0;
        if (!rd16(0x02, sc) || !rd16(0x01, ac) || !rd16(0x10, tl)) return {};
        if (sc != id(ina_expect_shunt_cal) || ac != id(ina_expect_adc_config) || tl != 0x7FFE) {
          // Review 2026-09-25: reboot rate limit. A chip that keeps resetting
          // would otherwise reboot the node about once a minute. After 3 reset
          // reboots in a row the next waits for 30 min of uptime (<= 2/h [D]);
          // meanwhile CHARGE is not used and current reads 1.09x (above). The
          // run of reboots ends after 1 h with the config held. 3 / 30 / 60 are
          // design choices, not measurements. is_running(): a component.update
          // (charger stop, manual anchor) inside the 2 s delay is not a second
          // reset. (host test S2b)
          const bool may_reboot = id(ina_reset_reboots) < 3 || millis() >= 1800000u;
          if (!id(ina_reset_seen) || (may_reboot && !id(ina_reset_reboot).is_running())) {
            id(ina_reset_seen) = true;
            char m[220];
            if (may_reboot)
              snprintf(m, sizeof(m),
                "INA228 reset while running (SHUNT_CAL=%u ADC_CONFIG=0x%04X TEMP_LIMIT=0x%04X; expected %u / 0x%04X / 0x7FFE) - CHARGE not used; rebooting to bridge (reset reboot %d in a row)",
                sc, ac, tl, id(ina_expect_shunt_cal), id(ina_expect_adc_config), id(ina_reset_reboots) + 1);
            else
              snprintf(m, sizeof(m),
                "INA228 reset while running (SHUNT_CAL=%u ADC_CONFIG=0x%04X TEMP_LIMIT=0x%04X; expected %u / 0x%04X / 0x7FFE) - CHARGE not used; reboot deferred to 30 min uptime (%d reset reboots in a row)",
                sc, ac, tl, id(ina_expect_shunt_cal), id(ina_expect_adc_config), id(ina_reset_reboots));
            ESP_LOGE("bank.hwcheck", "%s", m);
            id(ina228_reset_check).publish_state(m);
            if (may_reboot) {
              id(ina_reset_reboots) += 1;
              id(ina_reset_reboot).execute();
            }
          }
          return {};
        }
        if (id(ina_reset_reboots) != 0 && millis() >= 3600000u) id(ina_reset_reboots) = 0;
      }
      uint8_t reg = 0x0A;
      uint8_t b[5];
      id(hw_charge_raw_ah) = NAN;   // V1.26: NAN unless this read succeeds
      if (id(bus_a).write(0x40, &reg, 1, false) != i2c::ERROR_OK) return {};
      if (id(bus_a).read(0x40, b, 5) != i2c::ERROR_OK) return {};
      int64_t raw = ((int64_t) b[0] << 32) | ((int64_t) b[1] << 24) |
                    ((int64_t) b[2] << 16) | ((int64_t) b[3] << 8) | (int64_t) b[4];
      if (raw & (1LL << 39)) raw -= (1LL << 40);   // sign-extend 40-bit
      id(hw_charge_raw_ah) = (float) ((double) raw * (${ina_max_current_a} / 524288.0) / 3600.0);
      // V1.26: nothing is published (or saved) until this boot's reset check
      // has decided the offset — on_boot calls update() before that, to read.
      if (!id(hw_anchor_checked)) return {};
      float ah = id(hw_charge_raw_ah) + id(hw_charge_offset_ah);   // bridged
      if (isnan(id(hw_charge_saved_ah)) || fabsf(ah - id(hw_charge_saved_ah)) >= 0.01f)
        id(hw_charge_saved_ah) = ah;   // persisted in 10 mAh steps
      id(hw_last_good_ms) = millis();  // V1.28 (B2c)
      return ah;
    update_interval: 60s
    # V1.25: the delta is computed HERE, at the instant of the register read.
    # On its own 60 s poller it could sit up to 60 s from this read — up to
    # 1.33 Ah of pure timing skew at 80 A [D: 80 A × 60 s / 3600].
    on_value:
      # V1.28: the CHARGE bracket since the anchor, sign-split per poll (no
      # deadband). Wh = dQ × V_bus at the poll, NOT the ENERGY register (|P| per
      # conversion: idle noise reads as energy). The split loses <= 10 mAh per
      # reboot (step saves) and the first poll after boot; SOC uses hw - A, which
      # is exact, so only the O1 CE term (1 % of Ah in) ever sees that.
      - lambda: |-
          if (!id(brk_loaded)) {
            id(brk_loaded) = true;
            id(brk_in_ah) = id(brk_in_saved);   id(brk_out_ah) = id(brk_out_saved);
            id(brk_whin)  = id(brk_whin_saved); id(brk_whout)  = id(brk_whout_saved);
          }
          float prev = id(hw_prev_ah);
          id(hw_prev_ah) = x;
          if (isnan(prev)) return;
          float d = x - prev;
          float v = id(ina228_voltage).state;
          if (d > 0.0f) {
            id(brk_in_ah) += d;
            if (!isnan(v)) id(brk_whin) += d * v;
          } else {
            id(brk_out_ah) -= d;
            if (!isnan(v)) id(brk_whout) -= d * v;
          }
          if (fabsf(id(brk_in_ah)  - id(brk_in_saved))    >= 0.01f) id(brk_in_saved)    = id(brk_in_ah);
          if (fabsf(id(brk_out_ah) - id(brk_out_saved))   >= 0.01f) id(brk_out_saved)   = id(brk_out_ah);
          if (fabsf(id(brk_whin)   - id(brk_whin_saved))  >= 0.1f)  id(brk_whin_saved)  = id(brk_whin);
          if (fabsf(id(brk_whout)  - id(brk_whout_saved)) >= 0.1f)  id(brk_whout_saved) = id(brk_whout);
      - component.update: cycle_integration_delta
      - component.update: soc_estimate   # V1.28: SOC follows each CHARGE read

  - platform: template
    name: "HW Energy (INA228)"
    id: hw_energy_wh
    unit_of_measurement: "Wh"
    accuracy_decimals: 2
    icon: "mdi:lightning-bolt-circle"
    state_class: measurement
    entity_category: diagnostic
    lambda: |-
      uint8_t reg = 0x09;
      uint8_t b[5];
      if (id(bus_a).write(0x40, &reg, 1, false) != i2c::ERROR_OK) return {};
      if (id(bus_a).read(0x40, b, 5) != i2c::ERROR_OK) return {};
      uint64_t raw = ((uint64_t) b[0] << 32) | ((uint64_t) b[1] << 24) |
                     ((uint64_t) b[2] << 16) | ((uint64_t) b[3] << 8) | (uint64_t) b[4];
      id(hw_energy_raw_wh) = (float) (51.2 * (${ina_max_current_a} / 524288.0) * (double) raw / 3600.0);
      if (!id(hw_anchor_checked)) return {};   // V1.26: see hw_charge_ah
      float wh = id(hw_energy_raw_wh) + id(hw_energy_offset_wh);   // V1.26: bridged
      if (isnan(id(hw_energy_saved_wh)) || fabsf(wh - id(hw_energy_saved_wh)) >= 0.1f)
        id(hw_energy_saved_wh) = wh;   // persisted in 0.1 Wh steps
      return wh;
    update_interval: 60s
    # V1.28: idle ENERGY rate as a live noise gauge. ENERGY sums |P| per raw
    # conversion, so at idle its rate is set by the per-conversion error, not by
    # the ~0.14 W the bank really delivers [D: 10.5 mA × 13.30 V]. diag2 [M]:
    # 0.22-0.24 W quiet (white OLED, TX <= 14 dBm), 0.42-0.50 W noisy (20 dBm),
    # 0.99 W radio off. Quiet vs noisy moves the CHARGE drain by 1.3-2.6 mA.
    on_value:
      - lambda: |-
          static float p_wh = NAN;
          static uint32_t p_ms = 0;
          static float ema = NAN;
          uint32_t now = millis();
          float i = id(ina228_current).state;
          if (!isnan(p_wh) && now != p_ms) {
            float dt_h = (float) (now - p_ms) / 3600000.0f;
            float w = (x - p_wh) / dt_h;
            if (!isnan(i) && fabsf(i) < 0.5f) {
              if (dt_h > 0.008f && dt_h < 0.05f) {   // 30 s .. 3 min between reads
                ema = isnan(ema) ? w : 0.2f * w + 0.8f * ema;   // ~5 min
                id(ina_noise_gauge).publish_state(ema);
                id(ina_noise_state).publish_state(
                  ema <= 0.25f ? "quiet" : (ema >= 0.40f ? "noisy" : "elevated"));
              }
            } else if (!isnan(i)) {
              ema = NAN;
              id(ina_noise_gauge).publish_state(NAN);
              id(ina_noise_state).publish_state("n/a (bank not idle)");
            }
          }
          p_wh = x;
          p_ms = now;

  # SW net (this cycle) minus HW net since last anchor. Expected small and
  # stable (deadband/cadence term); NAN until an anchor has seeded the snapshot.
  - platform: template
    name: "Cycle Integration Delta (SW-HW)"
    id: cycle_integration_delta
    unit_of_measurement: "Ah"
    accuracy_decimals: 3
    icon: "mdi:scale-balance"
    state_class: measurement
    entity_category: diagnostic
    lambda: |-
      // V1.25: Unknown until this boot's INA228 power-on-reset check has run.
      if (!id(hw_anchor_checked)) return NAN;
      float hw = id(hw_charge_ah).state;
      float a  = id(hw_charge_anchor_ah);
      if (isnan(hw) || isnan(a)) return NAN;
      float sw = id(ah_charged_cycle).state - id(ah_discharged_cycle).state;
      return sw - (hw - a);
    update_interval: never   # V1.25: driven by hw_charge_ah on_value (see there)

  # ── V1.28: the CHARGE bracket since the current SOC anchor ─────────────────
  # For the full-to-full comparison: what left and entered the bank per the
  # INA228 CHARGE register (no deadband), and what the monitor saw as the idle
  # drain. Reset at every anchor (full charge, manual, provisional).
  - platform: template
    name: "Ah In Since Anchor"
    unit_of_measurement: "Ah"
    accuracy_decimals: 3
    icon: "mdi:battery-arrow-up"
    state_class: measurement
    entity_category: diagnostic
    lambda: 'return id(brk_loaded) ? id(brk_in_ah) : NAN;'
    update_interval: 60s

  - platform: template
    name: "Ah Out Since Anchor"
    unit_of_measurement: "Ah"
    accuracy_decimals: 3
    icon: "mdi:battery-arrow-down"
    state_class: measurement
    entity_category: diagnostic
    lambda: 'return id(brk_loaded) ? id(brk_out_ah) : NAN;'
    update_interval: 60s

  - platform: template
    name: "Wh In Since Anchor"
    unit_of_measurement: "Wh"
    accuracy_decimals: 1
    icon: "mdi:lightning-bolt"
    state_class: measurement
    entity_category: diagnostic
    lambda: 'return id(brk_loaded) ? id(brk_whin) : NAN;'
    update_interval: 60s

  - platform: template
    name: "Wh Out Since Anchor"
    unit_of_measurement: "Wh"
    accuracy_decimals: 1
    icon: "mdi:lightning-bolt-outline"
    state_class: measurement
    entity_category: diagnostic
    lambda: 'return id(brk_loaded) ? id(brk_whout) : NAN;'
    update_interval: 60s

  - platform: template
    name: "Hours Since Anchor"
    unit_of_measurement: "h"
    accuracy_decimals: 1
    icon: "mdi:timer-sand"
    entity_category: diagnostic
    lambda: |-
      bool anchored = !isnan(id(hw_charge_anchor_ah)) || !isnan(id(hw_prov_anchor_ah));
      return (anchored && id(anchor_epoch) != 0u) ? id(hours_since_anchor) : NAN;
    update_interval: 60s

  # Net CHARGE per hour since the anchor. Over an idle bracket this is the
  # standing drain the shunt sees (monitor + inverter off-draw + offset + DC).
  - platform: template
    name: "Mean Net Current Since Anchor"
    unit_of_measurement: "mA"
    accuracy_decimals: 2
    icon: "mdi:current-dc"
    state_class: measurement
    entity_category: diagnostic
    lambda: |-
      // From the bracket accumulators, not hw - A: a provisional anchor carries
      // its seed deficit in A (host replay: -27.8 mA read for a true -8.8 mA).
      bool anchored = !isnan(id(hw_charge_anchor_ah)) || !isnan(id(hw_prov_anchor_ah));
      float h = id(hours_since_anchor);
      if (!anchored || !id(brk_loaded) || id(anchor_epoch) == 0u || h < 1.0f) return NAN;
      return (id(brk_in_ah) - id(brk_out_ah)) / h * 1000.0f;
    update_interval: 60s

  # CHARGE SOC error at the last anchor (> 0 = SOC read high = drain it did not
  # see, or CE below recon_coul_eff). After a provisional start it also holds
  # that start's error - e.g. the SW ledger's at the first V1.28 boot.
  - platform: template
    name: "Last Anchor Closure"
    unit_of_measurement: "Ah"
    accuracy_decimals: 3
    icon: "mdi:scale-balance"
    entity_category: diagnostic
    lambda: 'return id(last_closure_ah);'
    update_interval: 300s

  # RECON (CHARGE), clean full-to-full brackets >= recon_min_days only: the
  # constant drain that closes the bracket. Candidate for soc_offset_ma.
  - platform: template
    name: "Suggested Offset Current"
    unit_of_measurement: "mA"
    accuracy_decimals: 2
    icon: "mdi:tune-variant"
    entity_category: diagnostic
    lambda: 'return id(last_offset_suggest_ma);'
    update_interval: 300s

  - platform: template
    name: "Last Charge Session Ah (CHARGE)"
    unit_of_measurement: "Ah"
    accuracy_decimals: 3
    icon: "mdi:battery-charging"
    entity_category: diagnostic
    lambda: 'return id(last_session_ah);'
    update_interval: 300s

  - platform: template
    name: "Last Charge Session Wh (CHARGE)"
    unit_of_measurement: "Wh"
    accuracy_decimals: 1
    icon: "mdi:battery-charging-outline"
    entity_category: diagnostic
    lambda: 'return id(last_session_wh);'
    update_interval: 300s

  # Published by hw_energy_wh's on_value (idle only).
  - platform: template
    name: "INA228 Noise Gauge"
    id: ina_noise_gauge
    unit_of_measurement: "W"
    accuracy_decimals: 3
    icon: "mdi:waveform"
    state_class: measurement
    entity_category: diagnostic

  # Published by the 300 s Wi-Fi readback interval.
  - platform: template
    name: "WiFi TX Power (Driver)"
    id: wifi_txp_readback
    unit_of_measurement: "dBm"
    accuracy_decimals: 2
    icon: "mdi:antenna"
    entity_category: diagnostic

  - platform: template
    name: "Apparent Ri Sample Count"
    accuracy_decimals: 0
    icon: "mdi:counter"
    entity_category: diagnostic
    lambda: 'return (float)id(ri_sample_count);'
    update_interval: 60s

  # --------------------------------------------------------------------------
  # Last full-charge cycle summary — persisted in globals (panel ⑥).
  # NaN guard suppresses 0.0 display before first full charge completes.
  # --------------------------------------------------------------------------
  - platform: template
    name: "Last Cycle Ah Discharged"
    unit_of_measurement: "Ah"
    accuracy_decimals: 1
    icon: "mdi:battery-arrow-down"
    lambda: |-
      float v = id(last_cycle_ah_out);
      return (v > 0.0f) ? v : NAN;
    update_interval: 60s

  - platform: template
    name: "Last Cycle Ah Charged"
    unit_of_measurement: "Ah"
    accuracy_decimals: 1
    icon: "mdi:battery-charging"
    lambda: |-
      float v = id(last_cycle_ah_in);
      return (v > 0.0f) ? v : NAN;
    update_interval: 60s

  - platform: template
    name: "Last Coulombic Efficiency"
    unit_of_measurement: "%"
    accuracy_decimals: 1
    icon: "mdi:recycle"
    lambda: |-
      // Coulombic efficiency = Ah_out / Ah_in (NOT energy RTE = Wh_out/Wh_in).
      float v = id(last_coulombic_eff);
      return (v > 0.0f) ? v : NAN;
    update_interval: 60s

  # Peak LiTime CC current — declining trend over months = charger aging
  - platform: template
    name: "Last Charge Peak Current"
    unit_of_measurement: "A"
    accuracy_decimals: 1
    icon: "mdi:flash"
    device_class: current
    entity_category: diagnostic
    lambda: |-
      float v = id(last_charge_peak_a);
      return (v > 0.5f) ? v : NAN;
    update_interval: 60s

  # CV/absorption time, last completed full-charge session (V1.19, persisted).
  # Charger-health trend metric: a multi-month upward drift in absorption
  # duration is an early indicator of capacity fade or a weak parallel string
  # (the bank takes longer to taper at the CV setpoint). Single samples are
  # noisy — depth-of-discharge before the charge dominates one-off values;
  # the signal is the TREND at comparable DoD. NaN until first full cycle.
  # Constant ~-30s offset vs true CV time (sensor debounce) — irrelevant for trend.
  - platform: template
    name: "CV Absorption Time"
    unit_of_measurement: "min"
    accuracy_decimals: 1
    icon: "mdi:battery-clock"
    entity_category: diagnostic
    lambda: |-
      float v = id(last_absorption_min);
      return (v > 0.0f) ? v : NAN;
    update_interval: 60s

  # Live CV/absorption elapsed, current charge session (V1.19, transient).
  # Sums closed segments + the open one (V-sag re-entry handled). NaN when no
  # CV time has accrued this session; resets via the session-end handlers.
  - platform: template
    name: "CV Absorption Elapsed"
    unit_of_measurement: "min"
    accuracy_decimals: 1
    icon: "mdi:progress-clock"
    entity_category: diagnostic
    lambda: |-
      uint32_t ms = id(absorption_ms_accum);
      if (id(absorption_start_ms) != 0u) ms += millis() - id(absorption_start_ms);
      return (ms > 0u) ? (float) ms / 60000.0f : NAN;
    update_interval: 60s

  # --------------------------------------------------------------------------
  # Discharge cycle health metrics — aging indicators (panel ⑥)
  # Both persisted in globals; NaN guard suppresses display before first full cycle.
  #
  # last_discharge_peak_a: magnitude of deepest discharge current last cycle.
  #   Deepening trend = load growth or increasing internal resistance.
  # last_discharge_mean_v: mean bus voltage during discharge last cycle.
  #   Declining trend at fixed load = rising internal resistance (key aging metric).
  #   Computed as integral(V dt) / integral(I dt) = volt-hours / amp-hours.
  # --------------------------------------------------------------------------
  - platform: template
    name: "Last Discharge Peak Current"
    id: last_discharge_peak_a_sensor
    unit_of_measurement: "A"
    accuracy_decimals: 1
    icon: "mdi:lightning-bolt"
    device_class: current
    entity_category: diagnostic
    lambda: |-
      float v = id(last_discharge_peak_a);
      return (v > 0.1f) ? v : NAN;   // Positive magnitude stored; NaN until first cycle
    update_interval: 60s

  - platform: template
    name: "Last Discharge Mean Voltage"
    id: last_discharge_mean_v_sensor
    unit_of_measurement: "V"
    accuracy_decimals: 3
    icon: "mdi:sine-wave"
    device_class: voltage
    entity_category: diagnostic
    lambda: |-
      float v = id(last_discharge_mean_v);
      // Wh/Ah = current-weighted mean voltage. LiFePO4 plateau ~12.6-13.0V;
      // guard >10V accepts any plausible discharge state.
      return (v > 10.0f) ? v : NAN;
    update_interval: 60s

  - platform: template
    name: "Total Full Charge Cycles"
    accuracy_decimals: 0
    icon: "mdi:counter"
    entity_category: diagnostic
    lambda: 'return (float)id(total_full_charge_count);'
    update_interval: 60s

  # --------------------------------------------------------------------------
  # Last outage summary (V1.9 — OBSERVABILITY, panel: outage planning)
  # Frozen at outage end (is_discharging on_release). NaN-guarded so HA shows
  # "unavailable" before the first outage rather than a misleading 0.
  # peak_w / avg_w answer "what can I run / what should I shed"; ah / wh / hours
  # record the event size; total count + lifetime Ah/Wh build the long record.
  # --------------------------------------------------------------------------
  - platform: template
    name: "Last Outage Ah"
    unit_of_measurement: "Ah"
    accuracy_decimals: 2
    icon: "mdi:battery-arrow-down"
    entity_category: diagnostic
    lambda: 'return (id(total_outage_count) > 0) ? id(last_outage_ah) : NAN;'
    update_interval: 60s

  - platform: template
    name: "Last Outage Wh"
    unit_of_measurement: "Wh"
    accuracy_decimals: 1
    icon: "mdi:lightning-bolt"
    entity_category: diagnostic
    lambda: 'return (id(total_outage_count) > 0) ? id(last_outage_wh) : NAN;'
    update_interval: 60s

  - platform: template
    name: "Last Outage Peak Power"
    unit_of_measurement: "W"
    accuracy_decimals: 0
    icon: "mdi:flash-alert"
    device_class: power
    entity_category: diagnostic
    lambda: 'return (id(total_outage_count) > 0) ? id(last_outage_peak_w) : NAN;'
    update_interval: 60s

  - platform: template
    name: "Last Outage Average Power"
    unit_of_measurement: "W"
    accuracy_decimals: 0
    icon: "mdi:flash"
    device_class: power
    entity_category: diagnostic
    lambda: 'return (id(total_outage_count) > 0) ? id(last_outage_avg_w) : NAN;'
    update_interval: 60s

  - platform: template
    name: "Last Outage Duration"
    unit_of_measurement: "h"
    accuracy_decimals: 2
    icon: "mdi:timer-outline"
    entity_category: diagnostic
    lambda: 'return (id(total_outage_count) > 0) ? id(last_outage_hours) : NAN;'
    update_interval: 60s

  - platform: template
    name: "Total Outage Events"
    accuracy_decimals: 0
    icon: "mdi:counter"
    entity_category: diagnostic
    lambda: 'return (float)id(total_outage_count);'
    update_interval: 60s

  # --------------------------------------------------------------------------
  # Self-discharge reconciliation result (V1.10 — OBSERVABILITY, logs/diagnostic).
  # Surfaces the last clean-anchor measurement. These are RECOMMENDATIONS — they
  # never auto-change SOC; apply by editing self_discharge_pct_per_month. NaN until
  # the first measured bracket (two clean anchors) completes.
  # --------------------------------------------------------------------------
  - platform: template
    name: "Last Unseen Drain"
    unit_of_measurement: "Ah"
    accuracy_decimals: 2
    icon: "mdi:battery-alert-variant-outline"
    entity_category: diagnostic
    # V1.28: written only by the CHARGE RECON (clean brackets); no longer tied to
    # the ledger's last_anchor_epoch.
    lambda: 'return (id(last_recommended_sd_rate) != 0.0f) ? id(last_unseen_drain_ah) : NAN;'
    update_interval: 300s

  - platform: template
    name: "Recommended Self-Discharge Rate"
    unit_of_measurement: "%/mo"
    accuracy_decimals: 2
    icon: "mdi:battery-clock-outline"
    entity_category: diagnostic
    lambda: 'return (id(last_recommended_sd_rate) != 0.0f) ? id(last_recommended_sd_rate) : NAN;'
    update_interval: 300s

  # --- ESP diagnostics -------------------------------------------------------
  - platform: uptime
    name: "Uptime"
    id: device_uptime
    update_interval: 60s

  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_rssi
    update_interval: 60s

  - platform: internal_temperature
    name: "ESP32 Internal Temperature"
    update_interval: 60s


text_sensor:

  # Published by ina228_alert on_press: decoded DIAG_ALRT tokens (UNDER-V OVER-V
  # OVER-I OVER-P MATH-OF MEM-ERR). Not persisted; use HA logbook for history.
  - platform: template
    name: "INA228 Alert Reason"
    id: alert_reason
    entity_category: diagnostic
    icon: "mdi:alert-circle-outline"

  # V1.27: outcome of this boot's INA228 power-on-reset check (on_boot) -
  # sentinel intact / first boot / BRIDGED / could not run / nothing to bridge.
  # Published once per boot, before Wi-Fi is up; HA gets it on connect.
  - platform: template
    name: "INA228 Reset Check"
    id: ina228_reset_check
    entity_category: diagnostic
    icon: "mdi:chip"

  # V1.28: which rung of the SOC ladder is live (published on change).
  - platform: template
    name: "SOC Source"
    id: soc_source
    icon: "mdi:source-branch"

  # V1.28: SHUNT_CAL / ADC_CONFIG as read back at boot (the B2a reference).
  - platform: template
    name: "INA228 Config Readback"
    id: ina228_config_readback
    entity_category: diagnostic
    icon: "mdi:chip"

  # V1.28: quiet / elevated / noisy from the idle ENERGY rate.
  - platform: template
    name: "INA228 Noise State"
    id: ina_noise_state
    entity_category: diagnostic
    icon: "mdi:waveform"

  # V1.28: the Wi-Fi driver's actual power-save mode (B1 check).
  - platform: template
    name: "WiFi Power Save (Driver)"
    id: wifi_ps_readback
    entity_category: diagnostic
    icon: "mdi:wifi-cog"

  # Bank State — HA automation trigger. Priority (first match):
  #   FAULT > OVERVOLTAGE > EMERGENCY > CRITICAL > WARNING >
  #   CHARGING_ABSORPT > CHARGING_BULK > HEAVY_LOAD > DISCHARGING > CHARGING > IDLE
  - platform: template
    name: "Bank State"
    id: bank_state
    icon: "mdi:state-machine"
    lambda: |-
      float i      = id(ina228_current).state;
      float v      = id(ina228_voltage).state;
      // Watchdog: >10s gap after 15s boot grace → FAULT.
      bool fault = (millis() > 15000u) && ((millis() - id(last_ina228_update)) > 10000u);
      if (fault || isnan(i) || isnan(v) || fabsf(i) > ${i_max_plausible_a}f)
        return std::string("FAULT");
      if (v > ${overvoltage_threshold}f && i > ${charge_threshold_a}f)
        return std::string("OVERVOLTAGE");
      if (v < ${emergency_voltage}f && i < ${discharge_threshold_a}f)
        return std::string("EMERGENCY");
      if (v < ${critical_voltage}f && i < ${discharge_threshold_a}f)
        return std::string("CRITICAL");
      if (v < ${warning_voltage}f && i < ${discharge_threshold_a}f)
        return std::string("WARNING");
      if (v >= ${full_charge_v_min}f && i > ${charge_threshold_a}f)
        return std::string("CHARGING_ABSORPT");
      if (i > ${bulk_charge_threshold_a}f && v < ${full_charge_v_min}f)
        return std::string("CHARGING_BULK");
      if (i < ${heavy_load_threshold_a}f)  return std::string("HEAVY_LOAD");
      if (i < ${discharge_threshold_a}f)   return std::string("DISCHARGING");
      if (i > ${charge_threshold_a}f)      return std::string("CHARGING");
      return                               std::string("IDLE");
    update_interval: 5s
    on_value:
      - lambda: |-
          ESP_LOGI("bank.state", "State -> %s | V=%.3fV I=%.3fA",
                   x.c_str(), id(ina228_voltage).state, id(ina228_current).state);

  # Discharge phase: Settling/Plateau/Knee/Cliff (voltage-based boundaries).
  # TODO: validate plateau_min_v + knee_min_v against report Fig.1.
  - platform: template
    name: "Discharge Phase"
    id: discharge_phase
    icon: "mdi:battery-arrow-down"
    lambda: |-
      float i = id(ina228_current).state;
      float v = id(ina228_voltage).state;
      if (isnan(i) || isnan(v))                return std::string("Unknown");
      if (i > ${discharge_threshold_a}f)       return std::string("N/A");    // Not discharging
      if (v > ${settling_min_v}f)              return std::string("Settling");
      if (v > ${plateau_min_v}f)              return std::string("Plateau");
      if (v > ${knee_min_v}f)                  return std::string("Knee");
      return                                          std::string("Cliff");
    update_interval: 30s    # 30s debounce — bank voltage transitions are slow
    on_value:
      - lambda: |-
          float i = id(ina228_current).state;
          if (i < ${discharge_threshold_a}f)  // Only log during active discharge
            ESP_LOGI("bank.phase", "Phase -> %s | V=%.3fV I=%.3fA | SOC~%.1f%% | Cycle Ah_out=%.2f",
                     x.c_str(), id(ina228_voltage).state, i,
                     id(soc_estimate).state, id(ah_discharged_cycle).state);

  - platform: version
    name: "ESPHome Version"

  - platform: wifi_info
    ip_address:
      name: "IP Address"
    ssid:
      name: "WiFi SSID"
    mac_address:
      name: "MAC Address"


binary_sensor:

  # Wake/cycle button: J2/GPIO4, R3 10k pull-up on board. 50ms debounce.
  # 1st press → wake to page 1; subsequent presses → advance page; resets sleep timer.
  - platform: gpio
    id: display_button
    name: "Display Button"
    entity_category: diagnostic
    pin:
      number: GPIO4
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 50ms
    on_press:
      then:
        - if:
            condition:
              lambda: 'return !id(panel).is_on();'
            then:
              # Was dark → wake to page 1.
              - lambda: 'id(panel).turn_on();'
              - display.page.show: page_main
            else:
              # Already lit → advance to the next page (wraps at the end).
              - display.page.show_next: panel
        # Every press resets the 5-min auto-sleep countdown.
        - script.execute: display_sleep_timer

  # --------------------------------------------------------------------------
  # GPIO20 history: V1.11 input clamp REMOVED in V1.15 (pin was a true NC pad
  # on the V2 Rev 1 layout). As of V1.18 / PCB Rev 1.1 the pin is REUSED as the
  # status-LED output (see `output:` block above). Do not re-add the clamp.

  # INA228 ALERT: GPIO5 (D3), active-low, R2 10kΩ pull-up on board.
  # Armed at boot via limit registers: BUVL/BOVL/SOVL/SUVL/PWR_LIMIT.
  # ALATCH=1 — pin latches until DIAG_ALRT is read (done in on_press below).
  # Known limit: while a latched condition persists, the binary sensor stays
  # pressed, so a second, different alert arriving during that window is not
  # re-decoded until the first clears.
  - platform: gpio
    id: ina228_alert
    name: "INA228 Alert"
    entity_category: diagnostic
    icon: "mdi:alert-circle-outline"
    pin:
      number: GPIO5
      mode:
        input: true
        pullup: false          # R2 (10kΩ) on board provides the pull-up — no internal needed
      inverted: true           # active-low → true = alert asserted
    filters:
      - delayed_on: 5ms        # debounce only; no delayed_off (latch clears on DIAG_ALRT read)
    on_press:
      - lambda: |-
          // Read DIAG_ALRT register (0x0B) — this also clears the ALATCH latch.
          uint8_t reg = 0x0B;
          uint8_t buf[2] = {0, 0};
          uint16_t diag = 0;

          // Write register pointer
          if (id(bus_a).write(0x40, &reg, 1, false) == i2c::ERROR_OK) {
            // Read 2 bytes
            if (id(bus_a).read(0x40, buf, 2) == i2c::ERROR_OK) {
              diag = ((uint16_t)buf[0] << 8) | buf[1];
            }
          }

          if (diag == 0) {
            ESP_LOGW("ina228_alert", "ALERT fired but DIAG_ALRT read failed or cleared");
            id(alert_reason).publish_state("ALERT: read error");
            return;
          }

          // Decode — multiple bits can be set simultaneously.
          // Bit map per INA228 datasheet (TI SLYS021) DIAG_ALRT: MEMSTAT=0, CNVRF=1, POL=2, BUSUL=3,
          // BUSOL=4, SHNTUL=5, SHNTOL=6, TMPOL=7, MATHOF=9.
          // (V1.18 fix: V1.16 positions were each one bit too high, and MEMSTAT
          // semantics were inverted — MEMSTAT reads 1 in NORMAL operation.)
          bool pol     = (diag >> 2) & 1;   // power over-limit (|P| > 1500 W)
          bool busul   = (diag >> 3) & 1;   // bus under-voltage (< 12.20 V)
          bool busol   = (diag >> 4) & 1;   // bus over-voltage (> 14.80 V)
          bool shntul  = (diag >> 5) & 1;   // shunt under-voltage = DISCHARGE over-current
          bool shntol  = (diag >> 6) & 1;   // shunt over-voltage  = CHARGE over-current
          bool tmpol   = (diag >> 7) & 1;   // die over-temperature (TEMP_LIMIT default — not armed)
          bool mathof  = (diag >> 9) & 1;   // arithmetic overflow (unexpected)
          bool memerr  = !(diag & 1);       // MEMSTAT==0 → trim-memory checksum FAULT

          char reason[96];
          snprintf(reason, sizeof(reason), "%s%s%s%s%s%s%s%s",
            busul  ? "UNDER-V " : "",
            busol  ? "OVER-V "  : "",
            shntul ? "OVER-I(DIS) " : "",
            shntol ? "OVER-I(CHG) " : "",
            pol    ? "OVER-P " : "",
            tmpol  ? "OVER-T " : "",
            mathof ? "MATH-OF " : "",
            memerr ? "MEM-ERR" : "");

          // Trim trailing space
          int len = strlen(reason);
          while (len > 0 && reason[len-1] == ' ') reason[--len] = '\0';
          if (len == 0) snprintf(reason, sizeof(reason), "UNKNOWN(0x%04X)", diag);

          ESP_LOGW("ina228_alert", "ALERT: %s  (DIAG_ALRT=0x%04X)", reason, diag);
          id(alert_reason).publish_state(std::string(reason));

  # Discharging: I < −0.05A sustained 30s (Option B).
  - platform: template
    name: "Discharging"
    id: is_discharging
    icon: "mdi:battery-arrow-down-outline"
    lambda: |-
      return id(ina228_current).state < ${discharge_threshold_a}f;
    filters:
      - delayed_on:  30s
      - delayed_off: 60s
    on_press:
      - lambda: |-
          // discharge_peak_a_raw is cycle-level (not reset here — reset at full charge).
          // Clear absorption_reached: confirmed discharge means bank left absorption state.
          if (id(absorption_reached)) {
            id(absorption_reached) = false;
            ESP_LOGD("bank", "Discharge started — cleared stale absorption_reached flag");
          }
          // Outage event start (V1.9): a sustained discharge on this backup bank is
          // an outage (or a deliberate test). Mark start time and zero the per-event
          // peak; the Ah/Wh integrations are reset by the action below.
          id(outage_elapsed_s) = 0u;
          id(outage_peak_w) = 0.0f;
          ESP_LOGI("bank",
            "Discharge session started | V=%.3fV | SOC~%.1f%% | Cycle Ah_out so far: %.2f",
            id(ina228_voltage).state,
            id(soc_estimate).state,
            id(ah_discharged_cycle).state);
      - sensor.integration.reset: outage_ah
      - sensor.integration.reset: outage_wh
    on_release:
      - lambda: |-
          // Outage event end: freeze the per-event summary for planning.
          // V1.20: duration from the persisted 5 s accumulator, not millis() delta —
          // survives mid-outage reboot exactly like the Ah/Wh/peak it is paired with.
          float hours = (float)id(outage_elapsed_s) / 3600.0f;
          float ah = id(outage_ah).state;
          float wh = id(outage_wh).state;
          if (isnan(ah)) ah = 0.0f;
          if (isnan(wh)) wh = 0.0f;
          float avg_w = (hours > 0.0027f) ? (wh / hours) : 0.0f;   // >~10s to avoid div blowup
          id(last_outage_ah)     = ah;
          id(last_outage_wh)     = wh;
          id(last_outage_peak_w) = id(outage_peak_w);
          id(last_outage_avg_w)  = avg_w;
          id(last_outage_hours)  = hours;
          id(total_outage_count)++;
          ESP_LOGI("bank.outage",
            "OUTAGE #%d ended | %.2f h | Ah=%.2f Wh=%.1f | peak=%.0fW avg=%.0fW | V=%.3fV SOC~%.1f%%",
            id(total_outage_count), hours, ah, wh,
            id(outage_peak_w), avg_w,
            id(ina228_voltage).state, id(soc_estimate).state);

  # Charging: I > +0.05A sustained 30s. ah_charged_cycle not reset here — accumulates
  # across sessions; only reset at confirmed full charge.
  - platform: template
    name: "Charging"
    id: is_charging
    device_class: battery_charging
    lambda: |-
      return id(ina228_current).state > ${charge_threshold_a}f;
    filters:
      - delayed_on:  30s
      - delayed_off: 60s
    on_press:
      - lambda: |-
          id(charge_session_start_v) = id(ina228_voltage).state;
          id(charge_peak_a_raw)      = 0.0f;   // Reset; 5s interval seeds peak from CC phase
          id(absorb_tail_min_a)      = NAN;    // V1.28 (O2): CV taper tracker
          id(absorb_tail_pending_a)  = NAN;
          id(sess_in_start)          = id(brk_in_ah);   // V1.28: CHARGE session totals
          id(sess_whin_start)        = id(brk_whin);
          ESP_LOGI("bank",
            "Charge session started | V_start=%.3fV | SOC~%.1f%% | Cycle Ah_in so far: %.2f",
            id(ina228_voltage).state,
            id(soc_estimate).state,
            id(ah_charged_cycle).state);
    on_release:
      # Full-charge event fires HERE (not in absorption_phase on_press) so that
      # it triggers on the charger-stop edge regardless of when the voltage sags.
      # absorption_reached is set by the absorption_phase binary sensor; once set
      # it persists until this on_release fires and clears it.
      then:
        # V1.28: a fresh CHARGE read first, so the session totals, the closure
        # and the anchor use this instant's register, not one up to 60 s old.
        - component.update: hw_charge_ah
        - lambda: |-
            // V1.28: this session's charge per the INA228 CHARGE register (no
            // deadband) - the number to hold against the drain it replaced.
            float s_in = id(brk_in_ah) - id(sess_in_start);
            float s_wh = id(brk_whin) - id(sess_whin_start);
            if (s_in < 0.0f) { s_in = id(brk_in_ah); s_wh = id(brk_whin); }   // re-anchored mid-session
            id(last_session_ah) = s_in;
            id(last_session_wh) = s_wh;
            ESP_LOGI("bank",
              "Charge session (INA228 CHARGE, no deadband): %.3f Ah / %.1f Wh in | CV tail min %.2f A (anchor needs <= %.1f A)",
              s_in, s_wh, id(absorb_tail_min_a), ${anchor_taper_max_a}f);
        - if:
            condition:
              lambda: |-
                // Guard: if net current is below -1.0A at charger-stop, a heavy load
                // overpowered the charger rather than the charger completing normally.
                // At a genuine LiTime absorption completion, current tapers to near-zero
                // before the charger stops — net current should be > -1.0A at that point.
                // Threshold -1.0A gives 1A headroom for minor standby loads (monitor
                // self-consumption ~0.1A is well clear of this guard).
                if (id(ina228_current).state < -1.0f) return false;
                if (!id(absorption_reached)) return false;
                // V1.28 (review O2): absorption for 60 s is not a full charge. A
                // generator that stops mid-CV, then > 60 s near 0 A, used to anchor
                // 100 % on a truncated charge - in exactly the outage cycle. Require
                // the CV current to have tapered first. LiTime stops at 6.48 A [M].
                // Limit: the INA228 sees NET current, so loads running during CV
                // make the taper look deeper than the charger's.
                float tail = id(absorb_tail_min_a);
                if (isnan(tail) || tail > ${anchor_taper_max_a}f) {
                  ESP_LOGW("bank",
                    "Full-charge anchor REFUSED (O2): CV current only tapered to %.2f A (needs <= %.1f A) - charger stopped mid-absorption; treated as a partial charge",
                    tail, ${anchor_taper_max_a}f);
                  return false;
                }
                return true;
            then:
              - lambda: |-
                  id(absorption_reached) = false;  // Clear before any yields
                  float ah_in  = id(ah_charged_cycle).state;
                  float ah_out = id(ah_discharged_cycle).state;
                  // Coulombic efficiency = Ah_out / Ah_in × 100%. Healthy LiFePO4: ~99%+.
                  // (This is NOT energy round-trip efficiency = Wh_out/Wh_in.)
                  // Guard: require > 10 Ah in and > 0 Ah out to avoid noise artifacts.
                  float coul_eff = (ah_in > 10.0f && ah_out > 0.0f)
                                ? (ah_out / ah_in) * 100.0f : 0.0f;
                  // Discharge cycle health metrics
                  float peak_discharge = -id(discharge_peak_a_raw);  // stored negative; expose as positive magnitude
                  float wh_cyc = id(wh_discharged_cycle).state;
                  // Wh/Ah = current-weighted mean voltage (correct).
                  // Vh/Ah = time-averaged voltage (wrong — units are V*h/A*h = ohms).
                  float mean_v = (ah_out > 1.0f && !isnan(wh_cyc) && wh_cyc > 0.0f)
                                   ? (wh_cyc / ah_out) : 0.0f;
                  id(last_discharge_peak_a)     = peak_discharge;
                  id(last_discharge_mean_v)     = mean_v;
                  // Charge cycle summary
                  id(last_cycle_ah_in)          = ah_in;
                  id(last_cycle_ah_out)         = ah_out;
                  id(last_coulombic_eff)        = coul_eff;
                  id(last_charge_peak_a)        = id(charge_peak_a_raw);
                  id(total_full_charge_count)++;
                  // Reset cycle-level discharge tracker for next cycle
                  id(discharge_peak_a_raw) = 0.0f;
                  // V1.19: finalize CV/absorption time for this session.
                  // Sequencing guarantee: absorption_phase releases 30 s after current
                  // stops (delayed_off 30s); is_charging releases at 60 s — so by the
                  // time this branch runs, the last CV segment is already accumulated.
                  // The open-segment close below is defensive only.
                  if (id(absorption_start_ms) != 0u) {
                    id(absorption_ms_accum) += millis() - id(absorption_start_ms);
                    id(absorption_start_ms) = 0u;
                  }
                  id(last_absorption_min) = (float) id(absorption_ms_accum) / 60000.0f;
                  id(absorption_ms_accum) = 0u;
                  ESP_LOGI("bank",
                    "FULL CHARGE #%d | Ah_out=%.2f Ah_in=%.2f | CoulEff=%.1f%% | mean_V=%.3fV | peak_dis=%.1fA | V=%.3fV | chrg_peak=%.1fA | CV=%.1f min",
                    id(total_full_charge_count), ah_out, ah_in, coul_eff, mean_v, peak_discharge,
                    id(ina228_voltage).state, id(charge_peak_a_raw), id(last_absorption_min));

                  // ---- V1.23: hardware-register confirming calculation ----
                  // Silicon CHARGE accumulator vs software coulomb ledger for
                  // the completed cycle. V1.28: the anchor itself is re-seeded
                  // below, through soc_anchor_set, after the closure.
                  float hw_now = id(hw_charge_ah).state;   // V1.28: read at this release
                  {
                    float hw_anchor = id(hw_charge_anchor_ah);
                    if (!isnan(hw_now) && !isnan(hw_anchor)) {
                      float sw_net = ah_in - ah_out;
                      float hw_net = hw_now - hw_anchor;
                      ESP_LOGI("bank.hwcheck",
                        "CYCLE CONFIRM | SW net=%.3f Ah | HW net=%.3f Ah | delta=%.3f Ah (%.2f%% of throughput) | INA228 resets bridged this cycle: %d",
                        sw_net, hw_net, sw_net - hw_net,
                        (ah_in + ah_out) > 1.0f ? 100.0f * (sw_net - hw_net) / (ah_in + ah_out) : 0.0f,
                        id(hw_bridge_count));   // V1.26: a bridged cycle carries the bridge error
                    } else {
                      ESP_LOGI("bank.hwcheck",
                        "CYCLE CONFIRM seeded at this anchor (hw=%.3f) — comparison from next cycle.",
                        hw_now);
                    }
                    id(hw_bridge_count) = 0;   // V1.26: count is per anchor-to-anchor cycle
                  }

                  // ---- V1.28: anchor closure and the CHARGE reconciliation ----
                  // Closure = the CHARGE SOC's own error at a KNOWN 100 %: net since
                  // the anchor, with CE (O1), I_off and the SD model applied, should
                  // be 0 here. > 0 = SOC read high = drain it did not see (or CE
                  // below recon_coul_eff). U = the whole constant drain the bracket
                  // needed = closure + what I_off and the SD model already took.
                  {
                    const float C = ${validated_capacity_ah}f;
                    float unc = id(soc_unclamped);   // set by this release's CHARGE read
                    float closure = isnan(unc) ? NAN : (unc - 100.0f) / 100.0f * C;
                    id(last_closure_ah) = closure;
                    float h = id(hours_since_anchor);
                    float sd_now = id(self_discharge_ah).state;
                    if (isnan(sd_now)) sd_now = 0.0f;
                    float b_in = id(brk_in_ah), b_out = id(brk_out_ah);
                    int src = id(soc_anchor_src);
                    const char *start = src == 1 ? "clean full charge" : (src == 2 ? "manual anchor" : "provisional anchor");
                    // CE only means something between two clean full charges.
                    float ce = (id(brk_clean) && src == 1 && b_in > 0.5f) ? 100.0f * b_out / b_in : NAN;
                    ESP_LOGI("bank.anchor",
                      "ANCHOR CLOSURE | %.3f Ah (CHARGE SOC read %.2f%% at a full bank) | %.1f h since the %s | CHARGE in %.3f Ah / out %.3f Ah, Wh in %.1f / out %.1f | CE %.2f%% (clean brackets only)",
                      closure, unc, h, start, b_in, b_out, id(brk_whin), id(brk_whout), ce);
                    if (id(brk_clean) && src == 1 && !isnan(closure) && h >= 1.0f) {
                      float U = closure + ${soc_offset_ma}f / 1000.0f * h + sd_now;
                      float days = h / 24.0f;
                      // 1 sigma: shunt ±1 % on both integrals, CE ±0.5 % on the charge
                      // term, and (V1.28) the INA228 offset limit over the bracket
                      // (review §6.2 item 5: ±2.67 mA × 1,440 h = 3.8 Ah is not "mAh").
                      float off_ah = ${ina_offset_max_ma}f / 1000.0f * h;
                      float sigma = sqrtf((0.01f*b_in)*(0.01f*b_in) + (0.01f*b_out)*(0.01f*b_out)
                                        + (0.005f*b_in)*(0.005f*b_in) + off_ah*off_ah);
                      float rate = (U / C) * 100.0f * (30.4375f / days);
                      float i_sug = U / h * 1000.0f;   // mA, constant-drain equivalent
                      bool publish = (days >= ${recon_min_days}f);
                      if (publish) {
                        id(last_unseen_drain_ah)     = U;
                        id(last_recommended_sd_rate) = rate;
                        id(last_offset_suggest_ma)   = i_sug;
                      }
                      const char *quality =
                        (!publish) ? "LOW-CONFIDENCE (short interval) - LOGGED ONLY" :
                        (fabsf(U) < 2.0f * sigma) ? "NOISE-LIMITED (U within 2sigma)" : "OK";
                      ESP_LOGI("bank.recon",
                        "RECON (CHARGE) | U=%.3f Ah (±%.3f 1sigma) over %.1f d = %.2f mA constant | suggest soc_offset_ma = %.2f (now %.2f) | quality: %s",
                        U, sigma, days, i_sug, i_sug, ${soc_offset_ma}f, quality);
                    } else {
                      ESP_LOGI("bank.recon",
                        "RECON (CHARGE) not measured: this bracket began at a %s - the closure above is that start's error plus any unseen drain. The next clean full charge starts a measuring bracket.",
                        start);
                    }
                  }

                  // ---- Self-discharge reconciliation (V1.10 — OBSERVABILITY, logs only) ----
                  // V1.28: this is the SW-LEDGER bracket, now LOGGED ONLY. The two
                  // entities come from the CHARGE RECON above; the ledger misses the
                  // idle drain (±50 mA deadband), so its U is that drain, not unseen.
                  // U = unseen drain = (recon_coul_eff × ah_in) − ah_out  [DC Ah that left
                  // the bank without crossing the shunt: intrinsic self-discharge + any
                  // INA228 offset]. Working in Ah cancels charger efficiency and the
                  // charge/discharge voltage gap; only the fixed ~1% coulombic term remains.
                  // CLEAN bracket: this anchor is absorption-confirmed (then-branch), and the
                  // prior epoch is only ever written from this same branch, so both ends are
                  // clean. Writes NOTHING to SOC — logs a recommended rate for the human.
                  //
                  // EPOCH DISCIPLINE: last_anchor_epoch is updated on EVERY clean anchor that
                  // has valid time, even when the U calc is skipped (gate/first-anchor). This
                  // prevents a later measurement from spanning two intervals (double-count) if
                  // a clean-but-small top-up occurs between two larger ones.
                  if (id(ha_time).now().is_valid()) {
                    uint32_t now_epoch = (uint32_t) id(ha_time).now().timestamp;
                    uint32_t prev = id(last_anchor_epoch);
                    if (prev != 0u && now_epoch > prev && ah_in >= ${recon_min_ah_in}f) {
                      float days = (float)(now_epoch - prev) / 86400.0f;
                      float U = ${recon_coul_eff}f * ah_in - ah_out;   // unseen drain, Ah
                      // Per-measurement uncertainty (1σ, Ah): shunt ±1% on both integrals
                      // + coulombic-efficiency uncertainty (~±0.5%) on the charge term.
                      // These scale with charge size; INA228 offset (~mAh) is negligible.
                      float sigma = sqrtf(
                          (0.01f*ah_in)*(0.01f*ah_in)
                        + (0.01f*ah_out)*(0.01f*ah_out)
                        + (0.005f*ah_in)*(0.005f*ah_in));
                      float rate = (days > 0.5f)
                        ? (U / ${validated_capacity_ah}f) * 100.0f * (30.4375f / days)
                        : 0.0f;
                      // V1.25: only brackets >= recon_min_days reach the entities.
                      // A 2-day discharge-test bracket scaled x15 to "%/month" would
                      // otherwise overwrite a 60-day idle measurement on the display
                      // with nothing but the coulombic-efficiency error [D].
                      bool publish = (days >= ${recon_min_days}f);   // V1.28: label only
                      const char* quality =
                        (!publish) ? "LOW-CONFIDENCE (short interval)" :
                        (fabsf(U) < 2.0f*sigma) ? "NOISE-LIMITED (U within 2sigma)" : "OK";
                      ESP_LOGI("bank.recon",
                        "RECON (SW ledger, log only) | U=%.2f Ah (±%.2f 1sigma) over %.1f d | ledger-equivalent rate %.2f %%/mo | quality: %s",
                        U, sigma, days, rate, quality);
                      ESP_LOGI("bank.recon",
                        "  (current substitution = %.2f %%/mo; edit to apply — SOC not auto-changed)",
                        ${self_discharge_pct_per_month}f);
                    } else if (prev == 0u) {
                      ESP_LOGI("bank.recon",
                        "Reconciliation seeded at first clean anchor; need a second to measure U.");
                    } else if (ah_in < ${recon_min_ah_in}f) {
                      ESP_LOGI("bank.recon",   // V1.25: was LOGD — invisible at level INFO
                        "Recon U skipped: ah_in %.1f < gate %.1f Ah (epoch still advanced).",
                        ah_in, ${recon_min_ah_in}f);
                    } else {
                      ESP_LOGW("bank.recon",
                        "Recon U skipped: non-monotonic time (now <= prior anchor).");
                    }
                    // Always advance the bracket start to this clean anchor.
                    id(last_anchor_epoch) = now_epoch;
                  } else {
                    ESP_LOGW("bank.recon",
                      "Reconciliation skipped: HA time not synced; last_anchor_epoch unchanged.");
                  }

                  // ---- V1.28: re-anchor SOC at this full charge (clean bracket) ----
                  id(absorb_tail_min_a) = NAN;
                  id(absorb_tail_pending_a) = NAN;
                  if (!isnan(hw_now)) {
                    id(soc_anchor_set).execute(hw_now, 1, true);
                  } else {
                    // CHARGE unreadable at the anchor: SOC re-seeds provisionally at
                    // 100 % on the next good read (carry-forward rung).
                    id(hw_charge_anchor_ah) = NAN;
                    id(hw_prov_anchor_ah) = NAN;
                    id(soc_last_good) = 100.0f;
                    id(brk_clean) = false;
                    ESP_LOGW("bank.anchor",
                      "Full charge confirmed but CHARGE unreadable: SOC re-seeds a provisional anchor at 100%% on the next good read");
                  }
              # Reset cycle counters — SOC anchored to 100%
              - sensor.integration.reset: ah_discharged_cycle
              - sensor.integration.reset: ah_charged_cycle
              - sensor.integration.reset: wh_discharged_cycle
              - sensor.integration.reset: self_discharge_ah   # V1.9: clear modeled SD at anchor
            else:
              - lambda: |-
                  // Partial charge session — absorption was not confirmed (or absorption
                  // WAS reached but a heavy load drove net current < -1.0A at charger-stop,
                  // tripping the guard). Either way, clear the flag here so it cannot
                  // survive to falsely anchor a later, unrelated partial charge to 100%.
                  bool was_set = id(absorption_reached);
                  id(absorption_reached) = false;
                  id(absorb_tail_min_a) = NAN;   // V1.28 (O2)
                  id(absorb_tail_pending_a) = NAN;
                  // V1.19: discard any accumulated CV time — a partial session is not a
                  // valid charger-health sample (the trend metric is only meaningful
                  // across COMPLETED absorption profiles). last_absorption_min untouched.
                  if (id(absorption_start_ms) != 0u) {
                    id(absorption_ms_accum) += millis() - id(absorption_start_ms);
                    id(absorption_start_ms) = 0u;
                  }
                  float cv_discarded = (float) id(absorption_ms_accum) / 60000.0f;
                  id(absorption_ms_accum) = 0u;
                  // Counters accumulate; SOC reflects actual partial charge returned. No anchor reset.
                  ESP_LOGI("bank",
                    "Charge session ended (no full-charge anchor) | absorption_reached was %s, now cleared | CV time discarded=%.1f min | V_end=%.3fV | Ah_in_cumulative=%.2f | Peak=%.1fA",
                    was_set ? "true" : "false",
                    cv_discarded,
                    id(ina228_voltage).state,
                    id(ah_charged_cycle).state,
                    id(charge_peak_a_raw));

  # 12.40V during discharge sustained 60s → notify, review load shedding.
  - platform: template
    name: "Voltage Warning"
    id: voltage_warning
    device_class: problem
    lambda: |-
      return id(ina228_voltage).state < ${warning_voltage}f &&
             id(ina228_current).state < ${discharge_threshold_a}f;
    filters:
      - delayed_on: 60s
    on_press:
      - lambda: |-
          ESP_LOGW("bank.alarm",
            "VOLTAGE WARNING: %.3fV < %.2fV | I=%.3fA | SOC~%.1f%% | Ah_out_cycle=%.2f",
            id(ina228_voltage).state, ${warning_voltage}f,
            id(ina228_current).state, id(soc_estimate).state,
            id(ah_discharged_cycle).state);

  # 12.20V during discharge sustained 30s → shed non-essential loads.
  - platform: template
    name: "Voltage Critical"
    id: voltage_critical
    device_class: problem
    lambda: |-
      return id(ina228_voltage).state < ${critical_voltage}f &&
             id(ina228_current).state < ${discharge_threshold_a}f;
    filters:
      - delayed_on: 30s
    on_press:
      - lambda: |-
          ESP_LOGE("bank.alarm",
            "VOLTAGE CRITICAL: %.3fV | TRIGGER HA LOAD SHEDDING | I=%.3fA | SOC~%.1f%%",
            id(ina228_voltage).state, id(ina228_current).state,
            id(soc_estimate).state);

  # 11.80V during discharge sustained 10s → shut inverter immediately.
  - platform: template
    name: "Voltage Emergency"
    id: voltage_emergency
    device_class: problem
    lambda: |-
      return id(ina228_voltage).state < ${emergency_voltage}f &&
             id(ina228_current).state < ${discharge_threshold_a}f;
    filters:
      - delayed_on: 10s    # Fast response — hardware protection imminent
    on_press:
      - lambda: |-
          ESP_LOGE("bank.alarm",
            "VOLTAGE EMERGENCY: %.3fV | SHUT DOWN INVERTER | I=%.3fA | SOC~%.1f%%",
            id(ina228_voltage).state, id(ina228_current).state,
            id(soc_estimate).state);

  # V > 14.80V while charging sustained 15s → charger not regulating, cut it.
  - platform: template
    name: "Battery Overvoltage"
    id: battery_overvoltage
    device_class: problem
    lambda: |-
      return id(ina228_voltage).state > ${overvoltage_threshold}f &&
             id(ina228_current).state > ${charge_threshold_a}f;
    filters:
      - delayed_on: 15s
    on_press:
      - lambda: |-
          ESP_LOGE("bank.alarm",
            "BATTERY OVERVOLTAGE: %.3fV > %.2fV while charging | CUT CHARGER | I=%.3fA",
            id(ina228_voltage).state, ${overvoltage_threshold}f,
            id(ina228_current).state);
    on_release:
      - lambda: |-
          ESP_LOGI("bank.alarm", "Overvoltage cleared | V=%.3fV", id(ina228_voltage).state);
  # Knee/cliff alarms require discharge + V < 12.65V + EMA slope threshold.
  # Voltage guard prevents false triggers during OCV settling phase.
  - platform: template
    name: "Knee Approaching"
    id: knee_approaching
    device_class: problem
    lambda: |-
      float slope = id(voltage_slope).state;
      float v     = id(ina228_voltage).state;
      float i     = id(ina228_current).state;
      if (isnan(slope) || isnan(v) || isnan(i)) return false;
      if (i > ${discharge_threshold_a}f) return false;   // Not discharging (Option B)
      if (v >= ${plateau_min_v}f) return false;           // Above knee territory
      return slope < ${knee_slope_threshold}f;
    filters:
      - delayed_on:  120s
      - delayed_off:  30s

  - platform: template
    name: "Cliff Imminent"
    id: cliff_imminent
    device_class: problem
    lambda: |-
      float slope = id(voltage_slope).state;
      float v     = id(ina228_voltage).state;
      float i     = id(ina228_current).state;
      if (isnan(slope) || isnan(v) || isnan(i)) return false;
      if (i > ${discharge_threshold_a}f) return false;   // Not discharging (Option B)
      if (v >= ${plateau_min_v}f) return false;           // Not below plateau
      return slope < ${cliff_slope_threshold}f;
    filters:
      - delayed_on:  60s
      - delayed_off: 30s

  # V ≥ 14.2V AND I > 0 sustained 60s → sets absorption_reached flag.
  # Detected mid-CV (not at cutoff edge) to handle sharp LiTime cutoffs reliably.
  # Full-charge event fires in is_charging on_release when flag is true.
  - platform: template
    name: "Absorption Phase"
    id: battery_fully_charged
    icon: "mdi:battery-charging-100"
    lambda: |-
      float v = id(ina228_voltage).state;
      float i = id(ina228_current).state;
      if (isnan(v) || isnan(i)) return false;
      return v >= ${full_charge_v_min}f && i > 0.0f;   // In CV absorption (Option B: I > 0 = charging)
    filters:
      - delayed_on:  60s    # 60 s sustained at absorption voltage → confirmed CV phase
      - delayed_off: 30s
    on_press:
      - lambda: |-
          id(absorption_reached) = true;
          // V1.19: open a CV-time segment. millis() never returns 0 here in
          // practice (60 s delayed_on guarantees uptime >> 0), so 0 is safe
          // as the "no open segment" sentinel.
          id(absorption_start_ms) = millis();
          ESP_LOGI("bank",
            "Absorption phase confirmed | V=%.3fV I=%.3fA | absorption_reached set, CV timer started",
            id(ina228_voltage).state, id(ina228_current).state);
    on_release:
      - lambda: |-
          // Absorption phase ended without the charger stopping (e.g., V sagged below
          // 14.2 V while charger still ran). Flag preserved — is_charging on_release
          // will still catch the full-charge event when the session ends.
          // V1.19: close the CV segment into the session accumulator. If V recovers
          // above 14.2 V, on_press opens a new segment — total CV time is the sum.
          if (id(absorption_start_ms) != 0u) {
            id(absorption_ms_accum) += millis() - id(absorption_start_ms);  // wrap-safe
            id(absorption_start_ms) = 0u;
          }
          ESP_LOGD("bank",
            "Absorption phase sensor released | V=%.3fV | absorption_reached=%s | CV accum=%.1f min",
            id(ina228_voltage).state, id(absorption_reached) ? "true" : "false",
            (float) id(absorption_ms_accum) / 60000.0f);

  # Sensor health
  # INA228 Watchdog: >10s gap in bus_voltage on_value callbacks → FAULT.
  # 15s boot grace; uint32_t millis() subtraction is wrap-safe. Auto-recovers.
  - platform: template
    name: "INA228 Watchdog"
    id: ina228_watchdog
    device_class: problem
    icon: "mdi:alert-circle"
    entity_category: diagnostic
    lambda: |-
      if (millis() < 15000u) return false;
      return (millis() - id(last_ina228_update)) > 10000u;
    on_press:
      - lambda: |-
          ESP_LOGE("bank.watchdog",
            "INA228 WATCHDOG FAULT: no read for >10s | millis=%lu last_update=%u",
            (unsigned long)millis(), id(last_ina228_update));
    on_release:
      - lambda: |-
          ESP_LOGI("bank.watchdog", "INA228 watchdog cleared — reads resuming");

  - platform: template
    name: "INA228 Healthy"
    device_class: connectivity
    lambda: 'return !isnan(id(ina228_voltage).state);'

  # |I| > 350A (saturated/open Kelvin lead) → freeze SOC + force FAULT.
  # NaN excluded (watchdog's job). Bounds-only: plausible-but-wrong not detectable.
  - platform: template
    name: "Current Channel Fault"
    id: current_channel_fault
    device_class: problem
    entity_category: diagnostic
    icon: "mdi:current-dc"
    lambda: |-
      float i = id(ina228_current).state;
      if (isnan(i)) return false;   // stale/dead bus is the watchdog's job, not this
      return fabsf(i) > ${i_max_plausible_a}f;
    filters:
      - delayed_on: 5s
    on_press:
      - lambda: |-
          ESP_LOGE("bank.current",
            "CURRENT CHANNEL FAULT: |I|=%.1fA > %.0fA plausible limit — SOC integration frozen; check Kelvin sense leads/fuses",
            id(ina228_current).state, ${i_max_plausible_a}f);
    on_release:
      - lambda: |-
          ESP_LOGI("bank.current", "Current channel fault cleared | I=%.3fA", id(ina228_current).state);

  - platform: template
    name: "DS18B20 Healthy"
    device_class: connectivity
    lambda: 'return !isnan(id(battery_temp).state);'


button:
  # Restart: 500ms flush before safe_reboot (platform: restart races log writes).
  # LOST on reboot: in-progress outage Ah/Wh, absorption_reached, discharge_peak_a_raw,
  # in-progress CV-absorption timing (absorption_start_ms / absorption_ms_accum).
  # PRESERVED: lifetime totals, last-outage summary, Ri sample count.
  # V1.26: discharge_peak_a_raw is now PRESERVED too (restore_value: yes), and
  # HW Net Charge / HW Energy continue across an INA228 reset (bridged, on_boot).
  - platform: template
    name: "Restart"
    id: btn_restart
    entity_category: diagnostic
    on_press:
      - logger.log:
          level: WARN
          format: "Manual restart pressed — current outage tracking (if any) will be lost"
      - delay: 500ms
      - lambda: |-
          App.safe_reboot();

  # Manual SOC anchor — press when confirmed 100% (missed full-charge event).
  - platform: template
    name: "Reset Ri Statistics (clear samples)"
    icon: "mdi:omega-off"
    entity_category: diagnostic
    on_press:
      - lambda: |-
          ESP_LOGI("bank.ri", "Ri statistics reset by operator (was n=%d, %.2f mOhm)",
                   id(ri_sample_count), id(last_ri_mohm));
          id(ri_sample_count) = 0;
          id(last_ri_mohm) = NAN;
          id(last_ri_temp_f) = NAN;
          id(apparent_ri).publish_state(NAN);
          id(apparent_ri_temp).publish_state(NAN);
  - platform: template
    name: "Acknowledge Alert (Clear Reason)"
    icon: "mdi:check-circle-outline"
    entity_category: diagnostic
    on_press:
      - lambda: |-
          ESP_LOGI("ina228_alert", "Alert reason acknowledged/cleared by operator");
          id(alert_reason).publish_state("none");
  - platform: template
    name: "Mark as Fully Charged (Reset Cycle Counters)"
    entity_category: diagnostic
    on_press:
      - component.update: hw_charge_ah   # V1.28: anchor on this instant's CHARGE
      - lambda: |-
          // Manual anchor IS a full-charge event: clear any pending absorption flag and
          // reset the cycle-level discharge peak tracker, mirroring the automatic path.
          // V1.28: SOC anchors through soc_anchor_set, labelled "manual" (review B3:
          // a one-tap 100 % must not look like a measured full charge). Its bracket
          // is not clean, so it never feeds RECON.
          {
            float unc = id(soc_unclamped);
            ESP_LOGW("bank.anchor",
              "MANUAL ANCHOR | CHARGE SOC read %.2f%% (closure %.3f Ah vs 100%%) - set to 100%% without absorption confirmation",
              unc, isnan(unc) ? NAN : (unc - 100.0f) / 100.0f * ${validated_capacity_ah}f);
            float hw = id(hw_charge_ah).state;
            if (!isnan(hw)) {
              id(soc_anchor_set).execute(hw, 2, false);
            } else {
              id(hw_charge_anchor_ah) = NAN;
              id(hw_prov_anchor_ah) = NAN;
              id(soc_last_good) = 100.0f;
              id(brk_clean) = false;
            }
          }
          id(absorb_tail_min_a) = NAN;
          id(absorb_tail_pending_a) = NAN;
          id(hw_bridge_count) = 0;   // V1.26: new anchor-to-anchor cycle
          id(absorption_reached) = false;
          id(discharge_peak_a_raw) = 0.0f;
          // V1.25: break the self-discharge bracket. This button resets the cycle
          // counters U is computed from but never moved last_anchor_epoch, so the
          // next clean anchor divided THIS cycle's Ah by days since the PREVIOUS
          // clean anchor. A manual anchor is not absorption-confirmed, so it cannot
          // start a clean bracket either: zero = the next clean anchor re-seeds.
          if (id(last_anchor_epoch) != 0u)
            ESP_LOGW("bank.recon",
              "Manual anchor: self-discharge bracket broken - next clean full charge re-seeds, the one after measures");
          id(last_anchor_epoch) = 0u;
      - sensor.integration.reset: ah_discharged_cycle
      - sensor.integration.reset: ah_charged_cycle
      - sensor.integration.reset: wh_discharged_cycle
      - sensor.integration.reset: self_discharge_ah
      - logger.log:
          level: INFO
          format: "Cycle counters reset manually — SOC anchored to 100%%; absorption flag cleared"

  # Reset lifetime counters — ONLY after physical bank replacement.
  - platform: template
    name: "Reset Lifetime Counters (Post Battery Swap)"
    entity_category: diagnostic
    on_press:
      - sensor.integration.reset: ah_discharged_lifetime
      - sensor.integration.reset: wh_discharged_lifetime
      - sensor.integration.reset: ah_charged_lifetime
      - sensor.integration.reset: wh_charged_lifetime
      - logger.log:
          level: WARN
          format: "Lifetime counters reset — use ONLY after physical battery swap"
