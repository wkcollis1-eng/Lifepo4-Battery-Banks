#             GPIO4 chosen because it is the native button pad on the V2 carrier
#             (R3 10k pull-up on board; J2 connector). logger baud_rate: 0 is
#             retained but no longer required to free this pin.
#           BURN-IN MANAGEMENT: SSD1306 panels dim with prolonged on-time, so the display
#             is OFF by default and only lit on demand. Wake/sleep uses the display C++
#             API turn_on()/turn_off()/is_on() ONLY — never id(display).setup() (ESPHome
#             issue #1393: repeated setup() calls to re-init/dim crash the device after a
#             while). A boot-time on_boot turns the panel off so it starts dark.
#           BEHAVIOR: 1st press wakes to page 1; each subsequent press cycles pages
#             (display.page.show_next, wraps); display sleeps after display_timeout
#             (substitution, default 5min) measured from the LAST press. Implemented with
#             a script (restart-on-each-press delay, then turn_off) so each press resets
#             the 5-min clock. NOTE: 5min/press trades panel longevity for dwell time;
#             display_timeout is a substitution so it can be shortened without a rewrite.
#           PAGES (4, button-cycled):
#             ① V / I / W / SOC — SOC large (the decision variable); current SIGNED and
#                direction-labeled (CHG/DISCHG) so "still draining + how fast" is explicit.
#             ② Runtime remaining + voltage slope (mV/min) + knee/cliff flags — turns a
#                bare SOC into "time to act"; guards runtime_hours NaN (not discharging).
#             ③ Health/trust — bank_state, INA228 watchdog, Current Channel Fault (V1.13),
#                DS18B20 health, battery temp. This is the "is the SOC trustworthy?" page,
#                most relevant exactly when the HA path is down.
#             ④ Charge/absorption — charge current + absorption_reached flag, so the
#                operator can charge to CONFIRMED absorption THEN switch the charger off,
#                ensuring the full-charge anchor fires and SOC re-pegs to 100%. Backstops
#                the re-anchoring dependency that is otherwise invisible at the panel.
#           BUS NOTE: 938 has onboard I2C pull-ups, as does the INA228 breakout. Two sets
#             in parallel lower effective pull-up R. Fine at 100kHz on short runs; if the
